openapi: 3.1.0
info:
  title: pglens HTTP API
  version: 1.0.0
  license:
    name: Apache-2.0
servers:
  - url: /
    description: the pglens server itself

tags:
  - name: clusters
  - name: instances
  - name: metrics
  - name: events
  - name: statements
  - name: ash
  - name: commands
  - name: alerts
  - name: findings
  - name: agent
  - name: infrastructure
  - name: session

security:
  - uiSession: []
  - agentBearer: []

components:
  securitySchemes:
    agentBearer:
      type: http
      scheme: bearer
      description: The agent bootstrap token.
    uiSession:
      type: apiKey
      in: cookie
      name: pglens_session

  schemas:
    Error:
      type: object
      required:
        - error
        - detail
      properties:
        error:
          type: string
        detail:
          type: string
    SessionLoginRequest:
      type: object
      additionalProperties: false
      required:
        - password
      properties:
        password:
          type: string
          format: password
          writeOnly: true
    SessionStatus:
      type: object
      required:
        - authenticated
      properties:
        authenticated:
          type: boolean
        configured:
          type: boolean
        expires_at:
          type: string
          format: date-time
    ClusterId:
      type: string
      pattern: '^[0-9]+$'
      description: A uint64 rendered as a decimal string because it exceeds the exact integer range of IEEE-754 numbers.
    InstanceId:
      type: string
      format: uuid
    Timestamp:
      type: string
      format: date-time
      description: RFC 3339 timestamp.
    NullableSeconds:
      type:
        - number
        - 'null'
      description: Duration in seconds; null means not measured, never zero.
    SeriesPoint:
      type: object
      required:
        - ts
        - value
      properties:
        ts:
          $ref: '#/components/schemas/Timestamp'
        value:
          type:
            - number
            - 'null'
    PermTier:
      type: string
      enum:
        - T0
        - T1
        - T2
    Health:
      type: string
      description: >-
        Computed per cluster on each read. critical when the cluster has no
        primary, or more than one. degraded when an instance that has not been
        superseded has not reported within 60 seconds, or the largest replay
        lag reported within the last 60 seconds is above 30 seconds. ok
        otherwise. The 30 second threshold is fixed on the server and no
        response field carries it, so a client that shows it must copy the
        value from this text.
      enum:
        - ok
        - degraded
        - critical
    Truncated:
      type: boolean
      description: True means the relation or cardinality budget cut the result.

    TopologyEdge:
      type: object
      required: [from, to, type, confidence]
      properties:
        from: { $ref: '#/components/schemas/InstanceId' }
        to: { $ref: '#/components/schemas/InstanceId' }
        type: { type: string }
        sync_state:
          type: [string, 'null']
          description: sync or async; null when not yet known.
        confidence:
          type: string
          enum: [high, low]
          description: >-
            high while the standby's WAL receiver is streaming or catching up;
            low when it is not, and the edge points at its last-known upstream.
        note:
          type: [string, 'null']
          description: Present on low-confidence edges.
    Event:
      type: object
      required: [event_id, ts, type, cluster_id, instance_id, payload]
      properties:
        event_id: { type: integer, format: int64 }
        ts: { $ref: '#/components/schemas/Timestamp' }
        type:
          type: string
          description: >-
            The event type. The server emits failover_detected, role_change,
            orphan_standby, split_brain_detected, agent_down, agent_up,
            instance_unreachable, instance_reachable, no_primary_in_cluster,
            slot_inactive, slot_lost, cluster_id_changed, cluster_identity_conflict,
            duplicate_instance_suspected, cardinality_truncated and
            counter_reset_detected. The set is open, so a client must show a
            type it does not know.
        cluster_id: { type: [string, 'null'] }
        instance_id: { type: [string, 'null'], format: uuid }
        payload: { type: object, additionalProperties: true }
    InstanceSummary:
      type: object
      required: [instance_id, addr, port, role, pg_version, perm_tier, last_seen, up]
      properties:
        instance_id: { $ref: '#/components/schemas/InstanceId' }
        addr: { type: string }
        port: { type: integer, format: int32 }
        role: { type: string }
        pg_version: { type: integer, format: int32 }
        perm_tier: { $ref: '#/components/schemas/PermTier' }
        last_seen: { $ref: '#/components/schemas/Timestamp' }
        up: { type: boolean }
    Cluster:
      type: object
      required: [cluster_id, name, id_source, primary, instance_count, health, instances]
      properties:
        cluster_id: { $ref: '#/components/schemas/ClusterId' }
        name: { type: [string, 'null'] }
        id_source: { type: string }
        primary: { type: [string, 'null'], format: uuid }
        instance_count: { type: integer, format: int32 }
        health: { $ref: '#/components/schemas/Health' }
        instances: { type: array, items: { $ref: '#/components/schemas/InstanceSummary' } }
        standby_count: { type: integer, format: int32 }
        sync_standby_count: { type: integer, format: int32 }
        max_replay_lag_seconds:
          allOf: [{ $ref: '#/components/schemas/NullableSeconds' }]
          description: Largest measurable replay lag; null means not measured, never zero.
        topology: { type: array, items: { $ref: '#/components/schemas/TopologyEdge' } }
    Database:
      type: object
      required: [datname, monitored]
      properties:
        datname: { type: string }
        monitored: { type: boolean }
        skip_reason: { type: [string, 'null'] }
    Instance:
      allOf:
        - $ref: '#/components/schemas/InstanceSummary'
        - type: object
          required: [cluster_id, databases, databases_not_monitored]
          properties:
            cluster_id: { $ref: '#/components/schemas/ClusterId' }
            databases: { type: array, items: { $ref: '#/components/schemas/Database' } }
            databases_not_monitored: { type: integer, format: int32 }
    MetricPoint:
      $ref: '#/components/schemas/SeriesPoint'
    MetricsResponse:
      type: object
      required: [series]
      properties:
        series: { type: array, items: { $ref: '#/components/schemas/MetricPoint' } }
    ReplicationEdge:
      type: object
      required: [from, to, metric, series]
      properties:
        from:
          type: string
          description: >-
            The standby. An instance ID when the edge resolves to a monitored
            instance; otherwise the application_name the primary reports the
            standby under (also in standby_name).
        to: { $ref: '#/components/schemas/InstanceId' }
        standby_name:
          type: string
          description: The application_name the primary reports the standby under; absent on edges read from the standby's own receiver.
        metric: { type: string, enum: [write_lag_sec, flush_lag_sec, replay_lag_sec] }
        sync_state: { type: [string, 'null'] }
        series: { type: array, items: { $ref: '#/components/schemas/MetricPoint' } }
    Slot:
      type: object
      required: [instance_id, slot_name, slot_type, active, wal_status, retained_bytes, safe_wal_size_bytes, last_active_at, ts]
      properties:
        instance_id: { $ref: '#/components/schemas/InstanceId' }
        slot_name: { type: string }
        slot_type: { type: [string, 'null'], description: physical or logical; null on rows written before the agent reported it. }
        active: { type: [boolean, 'null'] }
        wal_status: { type: [string, 'null'], description: 'pg_replication_slots.wal_status: reserved, extended, unreserved or lost.' }
        retained_bytes: { type: [integer, 'null'], format: int64, description: WAL the slot holds back from removal. }
        safe_wal_size_bytes:
          type: [integer, 'null']
          format: int64
          description: WAL that can still be written before the slot is invalidated; null when max_slot_wal_keep_size is unlimited.
        last_active_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
          description: The newest retained reading with the slot active; null when none is retained.
        ts: { $ref: '#/components/schemas/Timestamp' }
    SlotsResponse:
      type: object
      required: [cluster_id, slots]
      properties:
        cluster_id: { $ref: '#/components/schemas/ClusterId' }
        slots: { type: array, items: { $ref: '#/components/schemas/Slot' } }
    ReplicationResponse:
      type: object
      required: [cluster_id, edges]
      properties:
        cluster_id: { $ref: '#/components/schemas/ClusterId' }
        edges: { type: array, items: { $ref: '#/components/schemas/ReplicationEdge' } }
    TopologyResponse:
      type: object
      required: [cluster_id, topology, events]
      properties:
        cluster_id: { $ref: '#/components/schemas/ClusterId' }
        topology: { type: array, items: { $ref: '#/components/schemas/TopologyEdge' } }
        events: { type: array, items: { $ref: '#/components/schemas/Event' } }
    Statement:
      type: object
      required: [queryid, datname, query_text, truncated]
      properties:
        queryid: { type: string, pattern: '^-?[0-9]+$', description: PostgreSQL query ID as a decimal string. }
        datname: { type: string }
        query_text: { type: string }
        calls: { type: [number, 'null'], description: Calls observed in the window. }
        total_exec_time_ms: { type: [number, 'null'] }
        rows: { type: [number, 'null'] }
        mean_exec_time: { type: [number, 'null'], description: total_exec_time_ms divided by calls; absent when no call was observed. }
        shared_blks_hit: { type: [number, 'null'] }
        shared_blks_read: { type: [number, 'null'] }
        wal_bytes: { type: [number, 'null'] }
        temp_blks_written: { type: [number, 'null'] }
        truncated: { $ref: '#/components/schemas/Truncated' }
    StatementsResponse:
      type: object
      required: [statements, truncated, comparable_scope]
      properties:
        statements: { type: array, items: { $ref: '#/components/schemas/Statement' } }
        truncated:
          allOf: [{ $ref: '#/components/schemas/Truncated' }]
          description: >-
            True when the statements of the window may be incomplete. The flag
            covers the whole instance, not one database. Two records set it. A
            cardinality_truncated event of the statements check, with its time in
            the window, sets it, so a cut that happened inside the window is
            reported. A partial statements check, which kept only the top
            statements, sets it while its episode overlaps the window. That record
            is removed by the next complete result for its database, so a partial
            that ended inside the window and was followed by a complete result is
            not reported.
        comparable_scope: { type: string, enum: [cluster] }
        disabled:
          type: boolean
          description: >-
            Present as true while the agent skips the stat_statements check on
            this instance; statements collected before are still returned.
        disabled_reason:
          type: string
          description: The reason the agent gave for skipping the check.
    AshBucket:
      type: object
      required: [ts, samples, ticks, avg_active_sessions]
      properties:
        ts: { $ref: '#/components/schemas/Timestamp' }
        samples: { type: integer, format: int32 }
        ticks: { type: integer, format: int32 }
        avg_active_sessions:
          type: [number, 'null']
          description: samples divided by ticks; null when ticks is zero, never zero as a sentinel.
        datname: { type: string }
        wait_event_type: { type: string }
        wait_event: { type: string }
        state: { type: string }
        queryid: { type: [string, 'null'], pattern: '^-?[0-9]+$', description: PostgreSQL query ID as a decimal string. }
    CommandAuditEntry:
      type: object
      required: [audit_id, command_id, instance_id, kind, args, requested_by, executed_at, outcome]
      properties:
        audit_id: { type: integer, format: int64 }
        command_id: { type: string, format: uuid }
        instance_id: { $ref: '#/components/schemas/InstanceId' }
        kind: { type: string }
        args: { type: object, additionalProperties: true }
        requested_by:
          type: string
          description: >-
            The credential that requested the command: api-token, or
            ui-session with a short hash of the session, then from and the
            client address. Entries written before the request was audited
            read api.
        executed_at:
          type: string
          format: date-time
          description: When the event was recorded.
        outcome: { type: string, enum: [requested, ok, error, rejected, expired] }
        detail: { type: string, description: The error, rejection reason or expiry circumstance. }
    AshResponse:
      type: object
      required: [buckets, resolution_seconds, statistical]
      properties:
        buckets: { type: array, items: { $ref: '#/components/schemas/AshBucket' } }
        resolution_seconds: { type: integer, format: int32, description: Seconds between rows. Without group_by each row is one agent window, 10 seconds. With group_by it is the bucket size, a multiple of 10. }
        statistical: { type: boolean }
        warning: { type: string }
        enabled: { type: boolean, description: Present as false when ASH is disabled. }
    AshTopEntry:
      type: object
      required: [queryid, query_text, samples, ticks, avg_active_sessions]
      properties:
        queryid: { type: string, pattern: '^-?[0-9]+$', description: PostgreSQL query ID as a decimal string. }
        query_text: { type: string }
        samples: { type: integer, format: int32 }
        ticks: { type: integer, format: int32, description: The instance's sampling ticks over the range, the same for every entry. }
        avg_active_sessions: { type: [number, 'null'], description: samples divided by ticks, the average number of sessions running the query. }
    AshTopResponse:
      type: object
      required: [entries, resolution_seconds, statistical]
      properties:
        entries: { type: array, items: { $ref: '#/components/schemas/AshTopEntry' } }
        resolution_seconds: { type: integer, format: int32, description: Always 1. Each entry aggregates the whole range, so the answer has no time spacing to report. }
        statistical: { type: boolean }
        warning: { type: string }
        enabled: { type: boolean }
    Plan:
      type: object
      required: [plan_id, plan_hash, captured_at, analyzed, plan, changed]
      properties:
        plan_id: { type: integer, format: int64 }
        plan_hash: { type: string }
        captured_at: { $ref: '#/components/schemas/Timestamp' }
        analyzed: { type: boolean }
        plan: { type: object, additionalProperties: true }
        changed: { type: boolean }
    PlansResponse:
      type: object
      required: [plans, total_shapes]
      properties:
        plans: { type: array, items: { $ref: '#/components/schemas/Plan' } }
        total_shapes: { type: integer, format: int32 }
    ApiMetric:
      type: object
      required: [ts, value, labels]
      properties:
        ts: { $ref: '#/components/schemas/Timestamp' }
        value: { type: number }
        labels: { type: object, additionalProperties: { type: string } }
    LockSession:
      type: object
      description: A client session of the latest lock sample. It carries no query text; the text of a session in a blocking tree is on its node in nodes.
      properties:
        pid: { type: integer }
        session_id:
          type: string
          description: Identity that survives PID reuse, the lower-case hex of backend_start in microseconds since the Unix epoch, a dot, and the PID. Absent when the role may not see backend_start.
        backend_start:
          type: string
          format: date-time
          description: Start of the session. Absent when the role may not see it.
        wait_started_at:
          type: string
          format: date-time
          description: When the session began waiting for the lock it waits on now, from the server. Absent for a session that waits on no lock.
        wait_duration:
          type: number
          description: Seconds the session has waited for that lock, measured on the server at the sample. Absent for a session that waits on no lock.
        blocked_by: { type: array, items: { type: integer } }
        usename: { type: string }
        datname: { type: string }
        application_name: { type: string }
        client_addr: { type: string }
        state: { type: string }
        wait_event_type: { type: string }
        wait_event: { type: string }
        xact_age: { type: number, description: Seconds since the transaction started. }
        state_age: { type: number, description: Seconds since the state last changed. }
      additionalProperties: true
    LockNode:
      description: A session of the blocking tree, either blocked or a blocker. Nodes are the only sessions that carry query text.
      allOf:
        - $ref: '#/components/schemas/LockSession'
        - type: object
          properties:
            query:
              type: string
              description: Statement text, cut to 2048 bytes. Withheld as "[redacted]" when it may hold a credential or the server cut it short.
    LocksResponse:
      type: object
      required: [instance_id, sampled_at, stale, nodes, sessions]
      properties:
        instance_id: { $ref: '#/components/schemas/InstanceId' }
        sampled_at:
          type: [string, 'null']
          format: date-time
          description: Null when no lock tree has ever been sampled, not an empty timestamp.
        stale: { type: boolean }
        nodes:
          type: array
          items: { $ref: '#/components/schemas/LockNode' }
          description: The blocked sessions and their blockers in the latest lock sample, the only sessions with query text.
        sessions:
          type: array
          items: { $ref: '#/components/schemas/LockSession' }
          description: Every client session in the latest lock sample, capped and oldest transaction first, without query text.
    ActivityResponse:
      type: object
      required: [instance_id, stale, metrics]
      properties:
        instance_id: { $ref: '#/components/schemas/InstanceId' }
        stale: { type: boolean }
        metrics:
          type: object
          additionalProperties:
            type: array
            items: { $ref: '#/components/schemas/ApiMetric' }
    DatabasesResponse:
      type: object
      required: [instance_id, databases, not_monitored_count]
      properties:
        instance_id: { $ref: '#/components/schemas/InstanceId' }
        databases: { type: array, items: { $ref: '#/components/schemas/Database' } }
        not_monitored_count: { type: integer, format: int32 }
    HostResponse:
      type: object
      required: [instance_id, available]
      description: >-
        When available is true, the response carries the sample time, the
        source and each host metric as a top-level numeric property named
        host_*. When available is false, reason says why and no sample time
        is sent.
      properties:
        instance_id: { $ref: '#/components/schemas/InstanceId' }
        available: { type: boolean }
        reason: { type: string }
        source: { type: string }
        sampled_at: { $ref: '#/components/schemas/Timestamp' }
        stale: { type: boolean }
        metrics:
          type: object
          description: Never sent. Read the host_* properties instead.
          additionalProperties: { type: number }
    Setting:
      type: object
      required: [name, value, unit, source, context, pending_restart, first_seen, last_seen, changed_at]
      properties:
        name: { type: string }
        value: { type: [string, 'null'] }
        unit: { type: string }
        source: { type: string }
        context: { type: string }
        pending_restart: { type: string }
        first_seen: { $ref: '#/components/schemas/Timestamp' }
        last_seen: { $ref: '#/components/schemas/Timestamp' }
        changed_at: { $ref: '#/components/schemas/Timestamp' }
    SettingsResponse:
      type: object
      required: [instance_id, settings]
      properties:
        instance_id: { $ref: '#/components/schemas/InstanceId' }
        settings: { type: array, items: { $ref: '#/components/schemas/Setting' } }
    TriggersResponse:
      type: object
      required: [instance_id, triggers, truncated_databases]
      properties:
        instance_id: { $ref: '#/components/schemas/InstanceId' }
        triggers: { type: array, items: { $ref: '#/components/schemas/Trigger' } }
        truncated_databases:
          type: array
          items: { type: string }
          description: >-
            Databases with more triggers than the agent reports (1000); their
            list holds the disabled triggers first.
    Trigger:
      type: object
      required: [datname, schemaname, relname, name, kind, state, function, timing, events, level, constraint, constraint_type, first_seen, last_seen, changed_at]
      properties:
        datname: { type: string }
        schemaname: { type: string }
        relname: { type: string }
        name: { type: string }
        kind:
          type: string
          enum: [user, internal]
          description: >-
            internal is a trigger PostgreSQL creates to enforce a constraint
            (foreign key, deferrable unique); it is listed only when disabled.
        state:
          type: string
          enum: [enabled, disabled, replica, always, unknown]
          description: >-
            replica fires only in sessions with session_replication_role =
            replica, always in every session.
        function: { type: string, description: Schema-qualified trigger function. }
        timing: { type: string, enum: [BEFORE, AFTER, INSTEAD OF] }
        events: { type: string, description: 'Events joined by OR, e.g. INSERT OR UPDATE.' }
        level: { type: string, enum: [ROW, STATEMENT] }
        constraint: { type: string, description: Constraint an internal trigger enforces; empty otherwise. }
        constraint_type: { type: string, enum: ['', foreign key, unique, primary key, exclusion, constraint trigger, other] }
        first_seen: { $ref: '#/components/schemas/Timestamp' }
        last_seen: { $ref: '#/components/schemas/Timestamp' }
        changed_at: { $ref: '#/components/schemas/Timestamp' }
    UnindexedForeignKeysResponse:
      type: object
      required: [instance_id, foreign_keys, truncated_databases]
      properties:
        instance_id: { $ref: '#/components/schemas/InstanceId' }
        foreign_keys: { type: array, items: { $ref: '#/components/schemas/UnindexedForeignKey' } }
        truncated_databases:
          type: array
          items: { type: string }
          description: >-
            Databases with more unindexed foreign keys than the agent reports
            (200); their list holds the largest referencing tables.
    UnindexedForeignKey:
      type: object
      required: [datname, schemaname, relname, constraint, columns, referenced, table_bytes, first_seen, last_seen]
      properties:
        datname: { type: string }
        schemaname: { type: string }
        relname: { type: string, description: The referencing table. }
        constraint: { type: string }
        columns: { type: string, description: 'Referencing columns in key order, joined by ", ".' }
        referenced: { type: string, description: Schema-qualified referenced table. }
        table_bytes:
          type: integer
          format: int64
          description: Size of the referencing table (its leaf partitions for a partitioned table).
        first_seen: { $ref: '#/components/schemas/Timestamp' }
        last_seen: { $ref: '#/components/schemas/Timestamp' }
    ExtensionsResponse:
      type: object
      required: [instance_id, extensions, truncated_databases]
      properties:
        instance_id: { $ref: '#/components/schemas/InstanceId' }
        extensions: { type: array, items: { $ref: '#/components/schemas/Extension' } }
        truncated_databases: { type: array, items: { type: string } }
    Extension:
      type: object
      required: [datname, name, schema, version, default_version, upgrade, first_seen, last_seen, changed_at]
      properties:
        datname: { type: string }
        name: { type: string }
        schema: { type: string }
        version: { type: string, description: Installed version. }
        default_version:
          type: string
          description: Version the server's installed packages carry; empty when they no longer carry the extension.
        upgrade:
          type: string
          enum: [available, none, unknown]
          description: unknown when the packages lack the extension or a version is not dotted numbers.
        first_seen: { $ref: '#/components/schemas/Timestamp' }
        last_seen: { $ref: '#/components/schemas/Timestamp' }
        changed_at: { $ref: '#/components/schemas/Timestamp' }
    SpatialColumnsResponse:
      type: object
      required: [instance_id, columns, truncated_databases]
      properties:
        instance_id: { $ref: '#/components/schemas/InstanceId' }
        columns: { type: array, items: { $ref: '#/components/schemas/SpatialColumn' } }
        truncated_databases:
          type: array
          items: { type: string }
          description: Databases with more spatial columns than the agent reports (500); unindexed columns of the largest tables come first.
    SpatialColumn:
      type: object
      required: [datname, schemaname, relname, column, type, subtype, srid, srid_known, index_method, rows, first_seen, last_seen]
      properties:
        datname: { type: string }
        schemaname: { type: string }
        relname: { type: string }
        column: { type: string }
        type: { type: string, enum: [geometry, geography] }
        subtype: { type: string, description: 'Declared geometry type with its dimensions, e.g. PointZ; Geometry for any.' }
        srid:
          type: [integer, 'null']
          format: int32
          description: Declared SRID; null for a column declared without a typmod, whose values carry their own.
        srid_known:
          type: [boolean, 'null']
          description: Whether spatial_ref_sys defines the SRID (false for 0); null when unreadable or not declared.
        index_method:
          type: string
          enum: ['', gist, spgist, brin]
          description: Access method of the valid, non-partial index whose first key is the column; empty when none.
        rows: { type: number, format: double, description: Estimated rows of the table (pg_class.reltuples). }
        first_seen: { $ref: '#/components/schemas/Timestamp' }
        last_seen: { $ref: '#/components/schemas/Timestamp' }
    SequencesResponse:
      type: object
      required: [instance_id, sequences, truncated_databases]
      properties:
        instance_id: { $ref: '#/components/schemas/InstanceId' }
        sequences: { type: array, items: { $ref: '#/components/schemas/Sequence' } }
        truncated_databases:
          type: array
          items: { type: string }
          description: Databases with more sequences than the agent reports (500); the sequences closest to their limit come first.
    Sequence:
      type: object
      description: >-
        One sequence. Bounds and values are decimal strings, as a bigint
        sequence's range does not fit a JSON number exactly.
      required: [datname, schemaname, name, data_type, state, start, increment, min, max, cycle, last_value, limit, limit_source, exhausts, used_ratio, remaining, table_schema, table, column, column_type, link, columns, first_seen, last_seen, changed_at]
      properties:
        datname: { type: string }
        schemaname: { type: string }
        name: { type: string }
        data_type: { type: string, description: 'Declared type of the sequence: smallint, integer or bigint.' }
        state:
          type: string
          enum: [used, unused, hidden, unread]
          description: >-
            used: the value is known; unused: never called; hidden: the
            monitoring role has neither SELECT nor USAGE on the sequence;
            unread: reading it waited too long for a lock.
        start: { type: string }
        increment: { type: string }
        min: { type: string }
        max: { type: string }
        cycle: { type: boolean }
        last_value: { type: [string, 'null'], description: 'Null when never called or not readable.' }
        limit: { type: string, description: 'Last value the sequence can hand out that its column accepts.' }
        limit_source:
          type: string
          enum: [sequence, column]
          description: column when the integer type of the column the sequence feeds is narrower than the sequence.
        exhausts: { type: boolean, description: 'False for a cycling sequence whose own bound sets the limit: it wraps instead of failing.' }
        used_ratio: { type: [number, 'null'], format: double, description: 'Used fraction of the range from start to limit; null when not readable.' }
        remaining: { type: [string, 'null'], description: 'Values left before the limit; null when not readable.' }
        table_schema: { type: string }
        table: { type: string, description: 'Table of the column the sequence feeds; empty when it feeds none.' }
        column: { type: string }
        column_type: { type: string }
        link:
          type: string
          enum: ['', identity, owned, default]
          description: How the sequence is tied to the column; empty when it feeds none.
        columns: { type: integer, format: int32, description: 'Number of columns the sequence feeds; the narrowest is reported.' }
        first_seen: { $ref: '#/components/schemas/Timestamp' }
        last_seen: { $ref: '#/components/schemas/Timestamp' }
        changed_at: { $ref: '#/components/schemas/Timestamp' }
    PartitionedTablesResponse:
      type: object
      required: [instance_id, tables, truncated_databases]
      properties:
        instance_id: { $ref: '#/components/schemas/InstanceId' }
        tables: { type: array, items: { $ref: '#/components/schemas/PartitionedTable' } }
        truncated_databases:
          type: array
          items: { type: string }
          description: Databases with more partitioned tables than the agent reports (200); the largest come first.
    PartitionedTable:
      type: object
      description: A partition tree rolled up to its top partitioned table.
      required: [datname, schemaname, relname, strategy, partition_key, partitions, direct_partitions, depth, bytes, rows, default_partition, default_rows, invalid_indexes, analyzed_at, covered_until, first_seen, last_seen]
      properties:
        datname: { type: string }
        schemaname: { type: string }
        relname: { type: string }
        strategy: { type: string, enum: [range, list, hash] }
        partition_key: { type: string, description: 'Strategy and key columns, e.g. RANGE (created_at); an expression in the key reads "expression".' }
        partitions: { type: integer, format: int32, description: Leaf partitions in the whole tree. }
        direct_partitions: { type: integer, format: int32 }
        depth: { type: integer, format: int32, description: 'Levels below the top table: 1 without sub-partitions.' }
        bytes: { type: integer, format: int64, description: 'Leaves with their indexes and TOAST, estimated from relpages as of the last VACUUM or ANALYZE.' }
        rows: { type: number, format: double, description: Estimated rows of the leaves (reltuples). }
        default_partition: { type: [string, 'null'], description: 'schema.table of the default partition; null without one.' }
        default_rows: { type: [number, 'null'], format: double, description: 'Estimated rows in the default partition; null without one.' }
        invalid_indexes: { type: array, items: { type: string }, description: Partitioned indexes not valid because a partition lacks the index. }
        analyzed_at:
          oneOf:
            - { $ref: '#/components/schemas/Timestamp' }
            - { type: 'null' }
          description: When the partitioned table itself was last analyzed; null if never (autovacuum never analyzes it).
        covered_until:
          type: [string, 'null']
          description: >-
            For a table range-partitioned on one date or timestamp column,
            the highest upper bound of its partitions (RFC 3339), or
            "unbounded" when one reaches MAXVALUE; null for any other table.
        first_seen: { $ref: '#/components/schemas/Timestamp' }
        last_seen: { $ref: '#/components/schemas/Timestamp' }
    FunctionsResponse:
      type: object
      required: [instance_id, window_seconds, databases, functions]
      properties:
        instance_id: { $ref: '#/components/schemas/InstanceId' }
        window_seconds: { type: integer, format: int32, description: The span the rates are averaged over. }
        databases: { type: array, items: { $ref: '#/components/schemas/FunctionTracking' } }
        functions: { type: array, items: { $ref: '#/components/schemas/FunctionStat' } }
    FunctionTracking:
      type: object
      description: Whether a database's function calls are tracked.
      required: [datname, track_functions, tracked_functions, pl_functions, last_seen]
      properties:
        datname: { type: string }
        track_functions: { type: string, description: 'track_functions as the sessions of the database see it: none, pl or all.' }
        tracked_functions: { type: integer, format: int32, description: Functions pg_stat_user_functions holds statistics for. }
        pl_functions: { type: integer, format: int32, description: 'Functions written in a procedural language, outside extensions: those track_functions = pl tracks.' }
        last_seen: { $ref: '#/components/schemas/Timestamp' }
    FunctionStat:
      type: object
      description: >-
        A tracked function's calls and time over the window. Only the
        functions with the most time in their own body and the most calls
        are reported.
      required: [datname, schemaname, name, arguments, language, calls_per_second, total_ms_per_second, self_ms_per_second, mean_ms, last_seen]
      properties:
        datname: { type: string }
        schemaname: { type: string }
        name: { type: string }
        arguments: { type: string, description: The identity arguments, which tell overloads apart. }
        language: { type: string }
        calls_per_second: { type: number, format: double }
        total_ms_per_second: { type: number, format: double, description: Milliseconds spent in the function per second, the functions it calls included. }
        self_ms_per_second: { type: number, format: double, description: Milliseconds spent in the function's own body per second. }
        mean_ms:
          type: [number, 'null']
          format: double
          description: Mean time per call over the window; null when the function was not called in it.
        last_seen: { $ref: '#/components/schemas/Timestamp' }
    InternalsResponse:
      type: object
      required: [instance_id, window_seconds, wal_directory, databases, slru, temp_files, standby]
      properties:
        instance_id: { $ref: '#/components/schemas/InstanceId' }
        window_seconds: { type: integer, format: int32, description: The span the rates are averaged over. }
        wal_directory:
          oneOf:
            - { $ref: '#/components/schemas/WALDirectory' }
            - { type: 'null' }
          description: The latest listing of pg_wal in the window; null without one (no EXECUTE on pg_ls_waldir, or not scraped).
        databases:
          type: array
          items: { $ref: '#/components/schemas/DatabaseSize' }
          description: Each database's latest size, largest first; a database not sized in the last two hours is left out.
        slru: { type: array, items: { $ref: '#/components/schemas/SLRUCache' } }
        temp_files: { type: array, items: { $ref: '#/components/schemas/TempFileRate' } }
        standby:
          oneOf:
            - { $ref: '#/components/schemas/StandbyReplay' }
            - { type: 'null' }
          description: Null unless the instance replayed WAL in the window.
    WALDirectory:
      type: object
      required: [bytes, files, observed_at]
      properties:
        bytes: { type: number, format: double }
        files: { type: number, format: double }
        observed_at: { $ref: '#/components/schemas/Timestamp' }
    DatabaseSize:
      type: object
      required: [database, size_bytes, observed_at, growth_24h_bytes, growth_7d_bytes]
      properties:
        database: { type: string }
        size_bytes: { type: number, format: double }
        observed_at: { $ref: '#/components/schemas/Timestamp' }
        growth_24h_bytes:
          type: [number, 'null']
          format: double
          description: Size change since the size measured about 24 hours before; null without one.
        growth_7d_bytes:
          type: [number, 'null']
          format: double
          description: Size change since the size measured about 7 days before; null without one.
    SLRUCache:
      type: object
      description: One SLRU cache, named as PostgreSQL 17 and later name it on every version.
      required: [name, hit_ratio, hits_per_second, reads_per_second, writes_per_second, zeroed_per_second, flushes_per_second, truncates_per_second, exists_per_second, last_seen]
      properties:
        name: { type: string, example: multixact_offset }
        hit_ratio:
          type: [number, 'null']
          format: double
          description: Hits over hits and reads; null when the cache was not read in the window.
        hits_per_second: { type: number, format: double }
        reads_per_second: { type: number, format: double, description: Pages read from disk, under the cache's lock. }
        writes_per_second: { type: number, format: double }
        zeroed_per_second: { type: number, format: double }
        flushes_per_second: { type: number, format: double }
        truncates_per_second: { type: number, format: double }
        exists_per_second: { type: number, format: double }
        last_seen: { $ref: '#/components/schemas/Timestamp' }
    TempFileRate:
      type: object
      required: [database, files_per_second, bytes_per_second]
      properties:
        database: { type: string }
        files_per_second: { type: number, format: double, description: Temporary files written by queries that outgrew work_mem. }
        bytes_per_second: { type: number, format: double }
    StandbyReplay:
      type: object
      required: [replay_paused, observed_at, conflicts, prefetch_blocks_per_second]
      properties:
        replay_paused: { type: boolean, description: Whether WAL replay was paused at the latest scrape. }
        observed_at: { $ref: '#/components/schemas/Timestamp' }
        conflicts: { type: array, items: { $ref: '#/components/schemas/RecoveryConflictRate' } }
        prefetch_blocks_per_second:
          type: object
          additionalProperties: { type: number, format: double }
          description: The WAL prefetcher's blocks per second by outcome (prefetch, hit, skip_init, skip_new, skip_fpw, skip_rep).
    RecoveryConflictRate:
      type: object
      description: Standby queries of a database cancelled by recovery conflicts of one reason; only reasons with a rate above zero.
      required: [database, reason, per_second]
      properties:
        database: { type: string }
        reason: { type: string, example: snapshot }
        per_second: { type: number, format: double }
    LogicalReplicationResponse:
      type: object
      required: [instance_id, window_seconds, subscriptions, slots]
      properties:
        instance_id: { $ref: '#/components/schemas/InstanceId' }
        window_seconds: { type: integer, format: int32, description: The span the slot rates are averaged over. }
        subscriptions: { type: array, items: { $ref: '#/components/schemas/Subscription' } }
        slots: { type: array, items: { $ref: '#/components/schemas/LogicalSlotStats' } }
    Subscription:
      type: object
      description: A subscription of the instance. Its connection string is never read.
      required: [name, database, owner, enabled, slot_name, publications, apply_worker, sync_workers, last_message_at, apply_errors, sync_errors, conflicts, first_seen, last_seen]
      properties:
        name: { type: string }
        database: { type: string, description: The database the subscription applies changes to. }
        owner: { type: string }
        enabled: { type: boolean }
        slot_name:
          type: [string, 'null']
          description: The slot on the publisher; null when slot_name is NONE.
        publications: { type: array, items: { type: string } }
        apply_worker: { type: boolean, description: Whether an apply worker runs for it. }
        sync_workers: { type: integer, format: int32, description: Table synchronization workers running. }
        last_message_at:
          oneOf:
            - { $ref: '#/components/schemas/Timestamp' }
            - { type: 'null' }
          description: When the apply worker last heard from the publisher; null without a running worker.
        apply_errors: { type: integer, format: int64, description: Errors while applying changes, since the statistics were reset. }
        sync_errors: { type: integer, format: int64, description: Errors while synchronizing tables or sequences, since the statistics were reset. }
        conflicts:
          type: [integer, 'null']
          format: int64
          description: Conflicts met while applying changes (PostgreSQL 18 and later); null before.
        first_seen: { $ref: '#/components/schemas/Timestamp' }
        last_seen: { $ref: '#/components/schemas/Timestamp' }
    LogicalSlotStats:
      type: object
      description: The decoding rates of a logical slot over the window.
      required: [slot_name, bytes_per_second, txns_per_second, spill_bytes_per_second, spill_txns_per_second, stream_bytes_per_second, last_seen]
      properties:
        slot_name: { type: string }
        bytes_per_second: { type: number, format: double, description: Decoded transaction data sent to the slot's consumer. }
        txns_per_second: { type: number, format: double }
        spill_bytes_per_second: { type: number, format: double, description: Decoded data written to disk because it outgrew logical_decoding_work_mem. }
        spill_txns_per_second: { type: number, format: double }
        stream_bytes_per_second: { type: number, format: double, description: Decoded data streamed to the consumer before commit. }
        last_seen: { $ref: '#/components/schemas/Timestamp' }
    SecurityDefinerFunctionsResponse:
      type: object
      required: [instance_id, functions, truncated_databases]
      properties:
        instance_id: { $ref: '#/components/schemas/InstanceId' }
        functions: { type: array, items: { $ref: '#/components/schemas/SecurityDefinerFunction' } }
        truncated_databases:
          type: array
          items: { type: string }
          description: Databases with more SECURITY DEFINER functions than the agent reports (200); those without a pinned search_path come first.
    SecurityDefinerFunction:
      type: object
      description: A SECURITY DEFINER function or procedure outside extensions.
      required: [datname, schemaname, name, arguments, signature, kind, language, owner, owner_superuser, public_execute, search_path, pg_temp_last, first_seen, last_seen]
      properties:
        datname: { type: string }
        schemaname: { type: string }
        name: { type: string }
        arguments: { type: string }
        signature: { type: string, description: 'Schema-qualified, quoted name with its identity arguments, as ALTER FUNCTION takes it.' }
        kind: { type: string, enum: [function, procedure] }
        language: { type: string }
        owner: { type: string, description: The role whose privileges the function runs with. }
        owner_superuser: { type: boolean }
        public_execute: { type: boolean, description: Whether every role may execute it (the default for a function). }
        search_path:
          type: [string, 'null']
          description: The search_path the function pins; null when it pins none and uses the caller's.
        pg_temp_last: { type: boolean, description: Whether the pinned search_path names pg_temp last; otherwise the temporary schema is searched first for tables. }
        first_seen: { $ref: '#/components/schemas/Timestamp' }
        last_seen: { $ref: '#/components/schemas/Timestamp' }
    DriftValue:
      type: object
      required: [instance_id, role, value]
      properties:
        instance_id: { $ref: '#/components/schemas/InstanceId' }
        role: { type: string }
        value: { type: string }
    DriftEntry:
      type: object
      required: [name, values]
      properties:
        name: { type: string }
        values: { type: array, items: { $ref: '#/components/schemas/DriftValue' } }
    RelationResponse:
      type: object
      required: [instance_id, items, truncated, relations_not_reported]
      properties:
        instance_id: { $ref: '#/components/schemas/InstanceId' }
        items: { type: array, items: { type: object, additionalProperties: true } }
        truncated: { $ref: '#/components/schemas/Truncated' }
        relations_not_reported: { type: [integer, 'null'], format: int32 }
    Alert:
      type: object
      required: [alert_key, rule_id, severity, state, datname, labels, value, summary, started_at, last_eval_at, resolved_at, suppressed]
      properties:
        alert_key: { type: string }
        rule_id: { type: string }
        severity: { type: string, enum: [info, warning, critical] }
        state: { type: string, enum: [pending, firing, resolved] }
        cluster_id: { $ref: '#/components/schemas/ClusterId' }
        instance_id: { $ref: '#/components/schemas/InstanceId' }
        datname: { type: string }
        labels: { type: object, additionalProperties: true }
        value: { type: number }
        summary: { type: string }
        started_at: { $ref: '#/components/schemas/Timestamp' }
        last_eval_at: { $ref: '#/components/schemas/Timestamp' }
        resolved_at: { type: [string, 'null'], format: date-time }
        suppressed: { type: boolean }
    AlertRule:
      type: object
      required: [id, severity, scope, needs, min_tier, enabled, threshold, for_seconds]
      properties:
        id: { type: string }
        severity: { type: string }
        scope: { type: string }
        needs: { type: array, items: { type: string } }
        min_tier: { $ref: '#/components/schemas/PermTier' }
        enabled: { type: boolean }
        threshold: { type: number }
        for_seconds: { type: integer, format: int32, minimum: 0 }
    Silence:
      type: object
      required: [silence_id, matchers, reason, starts_at, ends_at]
      properties:
        silence_id: { type: string, format: uuid }
        matchers: { type: array, items: { type: object, additionalProperties: true } }
        reason: { type: string }
        starts_at: { $ref: '#/components/schemas/Timestamp' }
        ends_at: { $ref: '#/components/schemas/Timestamp' }
    Finding:
      type: object
      required: [finding_id, rule_id, severity, state, scope, title]
      properties:
        finding_id: { type: string }
        rule_id: { type: string }
        severity: { type: string }
        state: { type: string, enum: [open, degraded, muted, resolved] }
        scope: { type: string }
        cluster_id: { $ref: '#/components/schemas/ClusterId' }
        instance_id: { $ref: '#/components/schemas/InstanceId' }
        datname: { type: string }
        object_name: { type: string }
        title: { type: string }
        detail: { type: string }
        remediation: { type: string }
        evidence: { type: object, additionalProperties: true }
        degraded_reason: { type: string }
        first_seen: { $ref: '#/components/schemas/Timestamp' }
        last_seen: { $ref: '#/components/schemas/Timestamp' }
        resolved_at: { $ref: '#/components/schemas/Timestamp' }
        muted_until: { $ref: '#/components/schemas/Timestamp' }
        mute_reason: { type: string }
    AdvisorRule:
      type: object
      required: [id, severity, scope, needs, min_tier]
      properties:
        id: { type: string }
        severity: { type: string }
        scope: { type: string }
        needs: { type: array, items: { type: string } }
        min_tier: { $ref: '#/components/schemas/PermTier' }
    CommandArgs:
      type: object
      additionalProperties: false
      properties:
        queryid:
          oneOf:
            - { type: integer, format: int64 }
            - { type: string, pattern: '^-?[0-9]+$' }
        datname: { type: string }
        analyze: { type: boolean }
        pid: { type: integer, format: int32 }
        schema: { type: string }
        relation: { type: string }
        backend_start: { $ref: '#/components/schemas/Timestamp' }
      description: >-
        Per-kind arguments: explain requires queryid and may include datname or
        analyze; cancel and terminate require pid and may include backend_start;
        pgstattuple requires schema and relation and may include datname.
        backend_start is the start time of the session the caller saw at pid.
        Send it back exactly as the API reported it. When it is given and the
        session at pid started at another time, the agent refuses the command
        and signals nothing. datname is the database the command runs in;
        without it, the target DSN's own database. Query text is never sent to
        this API.
    CreateCommandRequest:
      type: object
      required: [kind, args]
      properties:
        kind: { type: string, enum: [explain, cancel, terminate, pgstattuple] }
        args: { $ref: '#/components/schemas/CommandArgs' }
      description: A command request contains identifiers and options only; query text is never sent.
    CreateCommandResponse:
      type: object
      required: [command_id]
      properties:
        command_id: { type: string, format: uuid }
    CommandResponse:
      type: object
      required: [command_id, state]
      properties:
        command_id: { type: string, format: uuid }
        state:
          type: string
          enum: [pending, claimed, done, failed, expired]
          description: Command lifecycle state persisted by the server.
        result: {}
        error: { type: string }
    PollCommand:
      type: object
      required: [command_id, kind, args, instance_id, cluster_id, claim_token, expires_at]
      properties:
        command_id: { type: string, format: uuid }
        kind: { type: string, enum: [explain, cancel, terminate, pgstattuple] }
        args: { $ref: '#/components/schemas/CommandArgs' }
        instance_id: { $ref: '#/components/schemas/InstanceId' }
        cluster_id: { $ref: '#/components/schemas/ClusterId' }
        claim_token: { type: string, format: uuid }
        expires_at: { $ref: '#/components/schemas/Timestamp' }
    CommandResultRequest:
      type: object
      required: [claim_token, outcome]
      properties:
        claim_token: { type: string, format: uuid }
        outcome: { type: string, enum: [ok, error, rejected] }
        result: {}
        error: { type: string }
      description: >-
        An ok outcome carries result; error and rejected outcomes carry error.
        The claim token must match the token returned by the poll operation.
    AlertRuleUpdate:
      type: object
      properties:
        enabled: { type: boolean }
        severity: { type: string, enum: [critical, warning, info] }
        threshold: { type: number }
        for_seconds: { type: integer, format: int32, minimum: 0 }
    AlertRuleUpdateResponse:
      type: object
      required: [rule_id, enabled, severity, threshold, for_seconds]
      properties:
        rule_id: { type: string }
        enabled: { type: boolean }
        severity: { type: string, enum: [critical, warning, info] }
        threshold:
          type:
            - number
            - 'null'
          description: The stored threshold; null when the rule has none.
        for_seconds: { type: integer, format: int32 }
    SilenceMatcher:
      type: object
      required: [name, value]
      properties:
        name: { type: string }
        value: { type: string }
        is_regex: { type: boolean }
        negate: { type: boolean }
    CreateSilenceRequest:
      type: object
      required: [matchers, reason, starts_at, ends_at]
      properties:
        silence_id: { type: string, format: uuid }
        matchers: { type: array, items: { $ref: '#/components/schemas/SilenceMatcher' } }
        reason: { type: string }
        starts_at: { $ref: '#/components/schemas/Timestamp' }
        ends_at: { $ref: '#/components/schemas/Timestamp' }
    MuteFindingRequest:
      type: object
      description: >-
        until must be in the future and at most 90 days ahead; a later one is
        refused with 400, so a mute always ends.
      required: [reason, until]
      properties:
        reason: { type: string }
        until: { $ref: '#/components/schemas/Timestamp' }
    MuteFindingResponse:
      type: object
      required: [finding_id, state, muted_until, mute_reason]
      properties:
        finding_id: { type: string }
        state: { type: string, enum: [muted] }
        muted_until: { $ref: '#/components/schemas/Timestamp' }
        mute_reason: { type: string }
    # The push schemas mirror internal/wire. The server decodes an envelope
    # with unknown fields disallowed, so every object here declares its fields
    # and refuses others.
    PushEnvelope:
      type: object
      additionalProperties: false
      required: [protocol_version, agent_id, agent_version, sent_at, instances]
      properties:
        protocol_version: { type: integer, format: int32 }
        agent_id: { type: string, description: The agent's UUID. Required from protocol 3 on. }
        agent_version: { type: string }
        sent_at: { $ref: '#/components/schemas/Timestamp' }
        instances: { type: array, items: { $ref: '#/components/schemas/PushInstance' } }
    PushInstance:
      type: object
      additionalProperties: false
      properties:
        instance_id: { type: string }
        target_name: { type: string }
        cluster_id: { type: string, description: Decimal string. }
        cluster_id_source: { type: string }
        addr: { type: string }
        port: { type: integer, format: int32 }
        pg_version: { type: integer, format: int32 }
        role: { type: string }
        perm_tier: { type: string }
        capabilities: { type: array, items: { type: string } }
        databases: { type: array, items: { $ref: '#/components/schemas/PushDatabase' } }
        results: { type: array, items: { $ref: '#/components/schemas/PushResult' } }
        topology_edges: { type: array, items: { $ref: '#/components/schemas/PushEdge' } }
        ash_enabled: { type: boolean, description: Absent from agents that predate the field. }
    PushDatabase:
      type: object
      additionalProperties: false
      properties:
        name: { type: string }
        monitored: { type: boolean }
        skip_reason: { type: string }
    PushEdge:
      type: object
      additionalProperties: false
      properties:
        from: { type: string }
        to: { type: string, description: The upstream's address. }
        port: { type: integer, format: int32 }
        type: { type: string }
        confidence: { type: string, enum: [high, low] }
    PushResult:
      type: object
      additionalProperties: false
      properties:
        check: { type: string }
        ts: { $ref: '#/components/schemas/Timestamp' }
        database: { type: string }
        stats_reset: { $ref: '#/components/schemas/Timestamp' }
        truncated: { type: boolean }
        partial: { type: boolean }
        error: { type: string }
        skip_reason: { type: string }
        metrics: { type: array, items: { $ref: '#/components/schemas/PushMetric' } }
        facts: { type: array, items: { $ref: '#/components/schemas/PushFact' } }
        query_texts:
          type: object
          description: Maps a queryid to its text.
          additionalProperties: { type: string }
    PushMetric:
      type: object
      additionalProperties: false
      properties:
        name: { type: string }
        labels: { type: object, additionalProperties: { type: string } }
        value: { type: number }
        kind: { type: string }
    PushFact:
      type: object
      additionalProperties: false
      properties:
        kind: { type: string }
        key: { type: string }
        labels: { type: object, additionalProperties: { type: string } }
        value_text: { type: string }
        value_json: { description: Any JSON value. }
    PushResponse:
      type: object
      required: [accepted, rejected]
      properties:
        accepted: { type: integer, format: int32 }
        rejected: { type: integer, format: int32 }

  responses:
    BadRequest:
      description: Bad request.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Authentication required or invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unprocessable:
      description: Request could not be processed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    PayloadTooLarge:
      description: Request payload is too large.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    UnsupportedMediaType:
      description: The body is not application/json.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

paths:
  /api/v1/clusters:
    get:
      tags: [clusters]
      operationId: getClusters
      summary: List monitored clusters.
      responses:
        '200':
          description: Cluster list.
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Cluster' } }
              examples:
                default:
                  value:
                    - cluster_id: '7381927364512345678'
                      name: pg-prod-eu
                      id_source: system_identifier
                      primary: 11111111-1111-1111-1111-111111111111
                      instance_count: 2
                      health: ok
                      standby_count: 1
                      sync_standby_count: 0
                      max_replay_lag_seconds: 0.12
                      topology:
                        - from: 11111111-1111-1111-1111-111111111111
                          to: 22222222-2222-2222-2222-222222222222
                          type: streaming
                          sync_state: async
                          confidence: high
                      instances:
                        - instance_id: 11111111-1111-1111-1111-111111111111
                          addr: pg-primary
                          port: 5432
                          role: primary
                          pg_version: 170006
                          perm_tier: T0
                          last_seen: '2026-08-27T02:00:00Z'
                          up: true
                        - instance_id: 22222222-2222-2222-2222-222222222222
                          addr: pg-standby
                          port: 5432
                          role: standby
                          pg_version: 170006
                          perm_tier: T0
                          last_seen: '2026-08-27T02:00:00Z'
                          up: true

  /api/v1/clusters/{id}/topology:
    get:
      tags: [clusters]
      operationId: getClusterTopology
      summary: Return the replication topology and failover events for a cluster.
      parameters:
        - { name: id, in: path, required: true, schema: { $ref: '#/components/schemas/ClusterId' } }
      responses:
        '200':
          description: Topology graph and the 100 newest failover events, newest first.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TopologyResponse' }
              examples:
                default:
                  value:
                    cluster_id: '7381927364512345678'
                    topology:
                      - from: 11111111-1111-1111-1111-111111111111
                        to: 22222222-2222-2222-2222-222222222222
                        type: streaming
                        sync_state: async
                        confidence: high
                    events:
                      - event_id: 1
                        ts: '2026-08-27T01:45:23Z'
                        type: failover_detected
                        cluster_id: '7381927364512345678'
                        instance_id: 22222222-2222-2222-2222-222222222222
                        payload:
                          old_primary: 11111111-1111-1111-1111-111111111111
                          new_primary: 22222222-2222-2222-2222-222222222222
        '400': { $ref: '#/components/responses/BadRequest' }

  /api/v1/clusters/{id}/replication:
    get:
      tags: [clusters]
      operationId: getClusterReplication
      summary: Return replication lag series for a cluster.
      parameters:
        - { name: id, in: path, required: true, schema: { $ref: '#/components/schemas/ClusterId' } }
        - name: from
          in: query
          required: true
          schema: { $ref: '#/components/schemas/Timestamp' }
        - name: to
          in: query
          required: true
          schema: { $ref: '#/components/schemas/Timestamp' }
      responses:
        '200':
          description: Lag series by replication edge and metric.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReplicationResponse' }
              examples:
                default:
                  value:
                    cluster_id: '7381927364512345678'
                    edges:
                      - from: 11111111-1111-1111-1111-111111111111
                        to: 22222222-2222-2222-2222-222222222222
                        metric: replay_lag_sec
                        sync_state: async
                        series:
                          - { ts: '2026-08-27T00:00:00Z', value: 0.0 }
                          - { ts: '2026-08-27T00:01:00Z', value: null }
                          - { ts: '2026-08-27T00:02:00Z', value: 0.05 }
                      - from: 11111111-1111-1111-1111-111111111111
                        to: 22222222-2222-2222-2222-222222222222
                        metric: write_lag_sec
                        sync_state: async
                        series:
                          - { ts: '2026-08-27T00:00:00Z', value: 0.001 }
                          - { ts: '2026-08-27T00:01:00Z', value: null }
                          - { ts: '2026-08-27T00:02:00Z', value: 0.002 }
                      - from: reporting-replica
                        to: 11111111-1111-1111-1111-111111111111
                        standby_name: reporting-replica
                        metric: replay_lag_sec
                        sync_state: async
                        series:
                          - { ts: '2026-08-27T00:00:00Z', value: 0.2 }
        '400': { $ref: '#/components/responses/BadRequest' }

  /api/v1/clusters/{id}/slots:
    get:
      tags: [clusters]
      operationId: getClusterSlots
      summary: Return the current state of every replication slot in a cluster.
      description: >-
        The newest reading of each slot reported in the last five minutes; a
        slot not reported for longer has been dropped or its instance is gone.
      parameters:
        - { name: id, in: path, required: true, schema: { $ref: '#/components/schemas/ClusterId' } }
      responses:
        '200':
          description: Replication slots by owning instance.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SlotsResponse' }
              examples:
                default:
                  value:
                    cluster_id: '7381927364512345678'
                    slots:
                      - instance_id: 11111111-1111-1111-1111-111111111111
                        slot_name: standby_1
                        slot_type: physical
                        active: false
                        wal_status: extended
                        retained_bytes: 2147483648
                        safe_wal_size_bytes: null
                        last_active_at: '2026-08-27T01:10:00Z'
                        ts: '2026-08-27T02:00:00Z'
        '400': { $ref: '#/components/responses/BadRequest' }

  /api/v1/clusters/{id}/settings-drift:
    get:
      tags: [clusters]
      operationId: getClusterSettingsDrift
      summary: Return settings that differ between instances in a cluster.
      parameters:
        - { name: id, in: path, required: true, schema: { $ref: '#/components/schemas/ClusterId' } }
      responses:
        '200':
          description: Differing settings only.
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/DriftEntry' } }
              examples:
                default:
                  value:
                    - name: max_connections
                      values:
                        - { instance_id: 11111111-1111-1111-1111-111111111111, role: primary, value: '200' }
                        - { instance_id: 22222222-2222-2222-2222-222222222222, role: standby, value: '100' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /api/v1/instances:
    get:
      tags: [instances]
      operationId: getInstances
      summary: List monitored instances.
      responses:
        '200':
          description: Instance list.
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/InstanceSummary' } }
              examples:
                default:
                  value:
                    - instance_id: 11111111-1111-1111-1111-111111111111
                      cluster_id: '7381927364512345678'
                      addr: pg-primary
                      port: 5432
                      role: primary
                      pg_version: 170006
                      perm_tier: T0
                      last_seen: '2026-08-27T02:00:00Z'
                      up: true

  /api/v1/instances/{id}:
    get:
      tags: [instances]
      operationId: getInstance
      summary: Return one instance and its databases.
      parameters:
        - { name: id, in: path, required: true, schema: { $ref: '#/components/schemas/InstanceId' } }
      responses:
        '200':
          description: Instance detail.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Instance' }
              examples:
                default:
                  value:
                    instance_id: 11111111-1111-1111-1111-111111111111
                    cluster_id: '7381927364512345678'
                    addr: pg-primary
                    port: 5432
                    role: primary
                    pg_version: 170006
                    perm_tier: T0
                    last_seen: '2026-08-27T02:00:00Z'
                    up: true
                    databases:
                      - { datname: app, monitored: true, skip_reason: null }
                    databases_not_monitored: 0
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/instances/{id}/activity:
    get:
      tags: [instances]
      operationId: getInstanceActivity
      summary: Return recent activity metrics grouped by metric name.
      parameters:
        - { name: id, in: path, required: true, schema: { $ref: '#/components/schemas/InstanceId' } }
      responses:
        '200':
          description: Recent activity; stale true means no fresh sample was observed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ActivityResponse' }
              examples:
                default:
                  value:
                    instance_id: 11111111-1111-1111-1111-111111111111
                    stale: false
                    metrics:
                      pg_connections_by_database:
                        - { ts: '2026-08-27T02:00:00Z', value: 3, labels: { datname: app } }
        '400': { $ref: '#/components/responses/BadRequest' }

  /api/v1/instances/{id}/databases:
    get:
      tags: [instances]
      operationId: getInstanceDatabases
      summary: List databases and monitoring status for an instance.
      parameters:
        - { name: id, in: path, required: true, schema: { $ref: '#/components/schemas/InstanceId' } }
      responses:
        '200':
          description: Database inventory.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DatabasesResponse' }
              examples:
                default:
                  value:
                    instance_id: 11111111-1111-1111-1111-111111111111
                    databases: [{ datname: app, monitored: true, skip_reason: null }]
                    not_monitored_count: 0
        '400': { $ref: '#/components/responses/BadRequest' }

  /api/v1/instances/{id}/host:
    get:
      tags: [instances]
      operationId: getInstanceHost
      summary: Return measurable host metrics for an instance.
      parameters:
        - { name: id, in: path, required: true, schema: { $ref: '#/components/schemas/InstanceId' } }
      responses:
        '200':
          description: Host metrics or an explicit unavailable response; unavailable values are never zero-filled.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HostResponse' }
              examples:
                default:
                  value:
                    instance_id: 11111111-1111-1111-1111-111111111111
                    available: false
                    reason: target is not local to any agent
        '400': { $ref: '#/components/responses/BadRequest' }

  /api/v1/instances/{id}/settings:
    get:
      tags: [instances]
      operationId: getInstanceSettings
      summary: Return observed PostgreSQL settings.
      parameters:
        - { name: id, in: path, required: true, schema: { $ref: '#/components/schemas/InstanceId' } }
        - name: changed_since
          in: query
          required: false
          schema: { $ref: '#/components/schemas/Timestamp' }
          description: Return settings changed at or after this RFC3339 timestamp.
      responses:
        '200':
          description: Settings observed for the instance.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SettingsResponse' }
              examples:
                default:
                  value:
                    instance_id: 11111111-1111-1111-1111-111111111111
                    settings:
                      - name: max_connections
                        value: '200'
                        unit: connections
                        source: config_file
                        context: postmaster
                        pending_restart: 'false'
                        first_seen: '2026-08-27T01:00:00Z'
                        last_seen: '2026-08-27T02:00:00Z'
                        changed_at: '2026-08-27T01:00:00Z'
        '400': { $ref: '#/components/responses/BadRequest' }

  /api/v1/instances/{id}/triggers:
    get:
      tags: [instances]
      operationId: getInstanceTriggers
      summary: Return the triggers of the instance's databases.
      description: >-
        The latest trigger_inventory scrape of each database reported in the
        last three hours: every user trigger, internal (constraint) triggers
        only when disabled, and a partition's inherited trigger only when its
        state differs from its parent's.
      parameters:
        - { name: id, in: path, required: true, schema: { $ref: '#/components/schemas/InstanceId' } }
        - name: datname
          in: query
          required: false
          schema: { type: string }
          description: Return the triggers of this database only.
      responses:
        '200':
          description: Triggers by database, schema, table and name.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TriggersResponse' }
              examples:
                default:
                  value:
                    instance_id: 11111111-1111-1111-1111-111111111111
                    triggers:
                      - { datname: app, schemaname: public, relname: orders, name: audit, kind: user, state: disabled, function: public.audit_orders, timing: AFTER, events: INSERT OR UPDATE, level: ROW, constraint: '', constraint_type: '', first_seen: '2026-08-27T01:00:00Z', last_seen: '2026-08-27T02:00:00Z', changed_at: '2026-08-27T01:30:00Z' }
                    truncated_databases: []
        '400': { $ref: '#/components/responses/BadRequest' }

  /api/v1/instances/{id}/unindexed-foreign-keys:
    get:
      tags: [instances]
      operationId: getInstanceUnindexedForeignKeys
      summary: Return the foreign keys no index serves.
      description: >-
        The latest fk_indexes scrape of each database reported in the last
        three hours. A foreign key is served by a valid, non-partial btree
        index whose leading key columns are its columns in any order, or by
        a hash index on its one column. Deleting a referenced row, or
        updating its key, scans the referencing table when none does.
      parameters:
        - { name: id, in: path, required: true, schema: { $ref: '#/components/schemas/InstanceId' } }
        - name: datname
          in: query
          required: false
          schema: { type: string }
          description: Return the foreign keys of this database only.
      responses:
        '200':
          description: Unindexed foreign keys by database, schema, table and constraint.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UnindexedForeignKeysResponse' }
              examples:
                default:
                  value:
                    instance_id: 11111111-1111-1111-1111-111111111111
                    foreign_keys:
                      - { datname: app, schemaname: public, relname: orders, constraint: orders_customer_id_fkey, columns: customer_id, referenced: public.customers, table_bytes: 52428800, first_seen: '2026-08-27T01:00:00Z', last_seen: '2026-08-27T02:00:00Z' }
                    truncated_databases: []
        '400': { $ref: '#/components/responses/BadRequest' }

  /api/v1/instances/{id}/extensions:
    get:
      tags: [instances]
      operationId: getInstanceExtensions
      summary: Return the extensions installed in each database.
      description: >-
        The latest extensions scrape of each database reported in the last
        three hours, with the version the installed packages would update
        each extension to.
      parameters:
        - { name: id, in: path, required: true, schema: { $ref: '#/components/schemas/InstanceId' } }
        - name: datname
          in: query
          required: false
          schema: { type: string }
          description: Return the extensions of this database only.
      responses:
        '200':
          description: Extensions by database and name.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExtensionsResponse' }
              examples:
                default:
                  value:
                    instance_id: 11111111-1111-1111-1111-111111111111
                    extensions:
                      - { datname: app, name: postgis, schema: public, version: 3.5.2, default_version: 3.6.4, upgrade: available, first_seen: '2026-08-27T01:00:00Z', last_seen: '2026-08-27T02:00:00Z', changed_at: '2026-08-27T01:00:00Z' }
                    truncated_databases: []
        '400': { $ref: '#/components/responses/BadRequest' }

  /api/v1/instances/{id}/spatial-columns:
    get:
      tags: [instances]
      operationId: getInstanceSpatialColumns
      summary: Return the PostGIS geometry and geography columns.
      description: >-
        The latest postgis_columns scrape of each database with PostGIS,
        reported in the last three hours. Only the catalogs are read: the
        subtype and SRID come from each column's declared typmod.
      parameters:
        - { name: id, in: path, required: true, schema: { $ref: '#/components/schemas/InstanceId' } }
        - name: datname
          in: query
          required: false
          schema: { type: string }
          description: Return the spatial columns of this database only.
      responses:
        '200':
          description: Spatial columns by database, schema, table and column.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SpatialColumnsResponse' }
              examples:
                default:
                  value:
                    instance_id: 11111111-1111-1111-1111-111111111111
                    columns:
                      - { datname: app, schemaname: public, relname: parcels, column: geom, type: geometry, subtype: MultiPolygon, srid: 3857, srid_known: true, index_method: '', rows: 250000, first_seen: '2026-08-27T01:00:00Z', last_seen: '2026-08-27T02:00:00Z' }
                    truncated_databases: []
        '400': { $ref: '#/components/responses/BadRequest' }

  /api/v1/instances/{id}/sequences:
    get:
      tags: [instances]
      operationId: getInstanceSequences
      summary: Return the sequences and how much of their range each has used.
      description: >-
        The latest sequences scrape of each database, reported in the last
        three hours. A sequence's range ends at the nearer of its own bound
        and the bound of the integer column it feeds. Values are read only
        where the monitoring role has SELECT on the sequence (tier 1 has it
        on all); the agent never advances a sequence.
      parameters:
        - { name: id, in: path, required: true, schema: { $ref: '#/components/schemas/InstanceId' } }
        - name: datname
          in: query
          required: false
          schema: { type: string }
          description: Return the sequences of this database only.
      responses:
        '200':
          description: Sequences by database, schema and name.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SequencesResponse' }
              examples:
                default:
                  value:
                    instance_id: 11111111-1111-1111-1111-111111111111
                    sequences:
                      - { datname: app, schemaname: public, name: orders_id_seq, data_type: bigint, state: used, start: '1', increment: '1', min: '1', max: '9223372036854775807', cycle: false, last_value: '2000000000', limit: '2147483647', limit_source: column, exhausts: true, used_ratio: 0.931323, remaining: '147483647', table_schema: public, table: orders, column: id, column_type: integer, link: owned, columns: 1, first_seen: '2026-08-27T01:00:00Z', last_seen: '2026-08-27T02:00:00Z', changed_at: '2026-08-27T01:00:00Z' }
                    truncated_databases: []
        '400': { $ref: '#/components/responses/BadRequest' }

  /api/v1/instances/{id}/functions:
    get:
      tags: [instances]
      operationId: getInstanceFunctions
      summary: Return the busiest tracked functions and each database's function tracking.
      description: >-
        Rates averaged over the last hour of function_stats scrapes. Without
        track_functions = pl or all, a database's functions are not tracked
        and none are listed for it; its tracking says so.
      parameters:
        - { name: id, in: path, required: true, schema: { $ref: '#/components/schemas/InstanceId' } }
        - name: datname
          in: query
          required: false
          schema: { type: string }
          description: Return the functions of this database only.
      responses:
        '200':
          description: Functions by self time, then calls.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FunctionsResponse' }
              examples:
                default:
                  value:
                    instance_id: 11111111-1111-1111-1111-111111111111
                    window_seconds: 3600
                    databases:
                      - { datname: app, track_functions: pl, tracked_functions: 14, pl_functions: 20, last_seen: '2026-08-27T02:00:00Z' }
                    functions:
                      - { datname: app, schemaname: public, name: audit_row, arguments: '', language: plpgsql, calls_per_second: 40.5, total_ms_per_second: 12.2, self_ms_per_second: 11.9, mean_ms: 0.3, last_seen: '2026-08-27T02:00:00Z' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /api/v1/instances/{id}/logical-replication:
    get:
      tags: [instances]
      operationId: getInstanceLogicalReplication
      summary: Return the subscriptions and the logical slots' decoding rates.
      description: >-
        The subscriptions of the latest logical_replication scrape, reported
        in the last three hours, and each logical slot's decoding rates
        averaged over the last hour. A subscription's connection string is
        never read.
      parameters:
        - { name: id, in: path, required: true, schema: { $ref: '#/components/schemas/InstanceId' } }
      responses:
        '200':
          description: Subscriptions by name; slots by spill rate, then decoding rate.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LogicalReplicationResponse' }
              examples:
                default:
                  value:
                    instance_id: 11111111-1111-1111-1111-111111111111
                    window_seconds: 3600
                    subscriptions:
                      - { name: orders_sub, database: app, owner: postgres, enabled: true, slot_name: orders_sub, publications: [orders], apply_worker: true, sync_workers: 0, last_message_at: '2026-08-27T01:59:40Z', apply_errors: 0, sync_errors: 0, conflicts: null, first_seen: '2026-08-27T01:00:00Z', last_seen: '2026-08-27T02:00:00Z' }
                    slots:
                      - { slot_name: orders_sub, bytes_per_second: 20480, txns_per_second: 12.5, spill_bytes_per_second: 0, spill_txns_per_second: 0, stream_bytes_per_second: 0, last_seen: '2026-08-27T02:00:00Z' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /api/v1/instances/{id}/internals:
    get:
      tags: [instances]
      operationId: getInstanceInternals
      summary: Return the WAL directory, database sizes, SLRU caches, temporary files and standby replay.
      description: >-
        The latest size of pg_wal; each database's size and its growth over
        24 hours and 7 days; each SLRU cache's rates and hit ratio, each
        database's temporary-file rates, and, for an instance that replayed
        WAL in the window, whether replay is paused, the queries recovery
        conflicts cancelled by database and reason, and the WAL prefetcher's
        rates. Rates are averaged over the last hour.
      parameters:
        - { name: id, in: path, required: true, schema: { $ref: '#/components/schemas/InstanceId' } }
      responses:
        '200':
          description: SLRU caches by hit rate; databases by temporary bytes; conflicts by rate.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InternalsResponse' }
              examples:
                default:
                  value:
                    instance_id: 11111111-1111-1111-1111-111111111111
                    window_seconds: 3600
                    wal_directory: { bytes: 1073741824, files: 64, observed_at: '2026-08-27T02:00:00Z' }
                    databases:
                      - { database: app, size_bytes: 53687091200, observed_at: '2026-08-27T02:00:00Z', growth_24h_bytes: 1073741824, growth_7d_bytes: null }
                    slru:
                      - { name: transaction, hit_ratio: 0.999, hits_per_second: 1200, reads_per_second: 1.2, writes_per_second: 0.5, zeroed_per_second: 0.01, flushes_per_second: 0.02, truncates_per_second: 0, exists_per_second: 0, last_seen: '2026-08-27T02:00:00Z' }
                    temp_files:
                      - { database: app, files_per_second: 0.2, bytes_per_second: 1048576 }
                    standby: null
        '400': { $ref: '#/components/responses/BadRequest' }

  /api/v1/instances/{id}/security-definer-functions:
    get:
      tags: [instances]
      operationId: getInstanceSecurityDefinerFunctions
      summary: Return the SECURITY DEFINER functions and procedures.
      description: >-
        The latest function_security scrape of each database, reported in
        the last three hours. Functions of extensions are left out.
      parameters:
        - { name: id, in: path, required: true, schema: { $ref: '#/components/schemas/InstanceId' } }
        - name: datname
          in: query
          required: false
          schema: { type: string }
          description: Return the functions of this database only.
      responses:
        '200':
          description: SECURITY DEFINER functions by database and signature.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SecurityDefinerFunctionsResponse' }
              examples:
                default:
                  value:
                    instance_id: 11111111-1111-1111-1111-111111111111
                    functions:
                      - { datname: app, schemaname: public, name: grant_role, arguments: 'r text', signature: 'public.grant_role(r text)', kind: function, language: plpgsql, owner: postgres, owner_superuser: true, public_execute: true, search_path: null, pg_temp_last: false, first_seen: '2026-08-27T01:00:00Z', last_seen: '2026-08-27T02:00:00Z' }
                    truncated_databases: []
        '400': { $ref: '#/components/responses/BadRequest' }

  /api/v1/instances/{id}/partitioned-tables:
    get:
      tags: [instances]
      operationId: getInstancePartitionedTables
      summary: Return the partitioned tables, each rolled up over its partitions.
      description: >-
        The latest partitions scrape of each database, reported in the last
        three hours. Only the catalogs and pg_stat_user_tables are read, so
        no table is locked: sizes and rows are the planner's estimates.
      parameters:
        - { name: id, in: path, required: true, schema: { $ref: '#/components/schemas/InstanceId' } }
        - name: datname
          in: query
          required: false
          schema: { type: string }
          description: Return the partitioned tables of this database only.
      responses:
        '200':
          description: Partitioned tables by database, schema and name.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PartitionedTablesResponse' }
              examples:
                default:
                  value:
                    instance_id: 11111111-1111-1111-1111-111111111111
                    tables:
                      - { datname: app, schemaname: public, relname: events, strategy: range, partition_key: RANGE (at), partitions: 13, direct_partitions: 13, depth: 1, bytes: 104857600, rows: 2500000, default_partition: public.events_default, default_rows: 1200, invalid_indexes: [], analyzed_at: null, covered_until: '2026-11-01T00:00:00Z', first_seen: '2026-08-27T01:00:00Z', last_seen: '2026-08-27T02:00:00Z' }
                    truncated_databases: []
        '400': { $ref: '#/components/responses/BadRequest' }

  /api/v1/instances/{id}/tables:
    get:
      tags: [instances]
      operationId: getInstanceTables
      summary: Return table relation statistics.
      description: >-
        The newest reading of each table reported in the last 15 minutes.
        seq_scan_rate and idx_scan_rate are scans per second over the last
        scrape interval; a column the agent could not read is absent.
        last_vacuum_age_seconds is the age of the last manual VACUUM at the
        scrape; last_vacuum_at, last_autovacuum_at, last_analyze_at and
        last_autoanalyze_at are the timestamps pg_stat_user_tables reports,
        absent when the table was never processed that way.
      parameters:
        - { name: id, in: path, required: true, schema: { $ref: '#/components/schemas/InstanceId' } }
        - name: order_by
          in: query
          required: false
          schema: { type: string, enum: [dead_tup, dead_ratio, size, seq_scan], default: dead_tup }
        - name: limit
          in: query
          required: false
          schema: { type: integer, format: int32, minimum: 1, maximum: 500, default: 50 }
          description: Maximum number of relations returned by the instance-level budget.
      responses:
        '200':
          description: Table rows and cardinality-budget metadata.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RelationResponse' }
              examples:
                default:
                  value:
                    instance_id: 11111111-1111-1111-1111-111111111111
                    items:
                      - { datname: app, schemaname: public, relname: users, n_live_tup: 1200, n_dead_tup: 30, dead_ratio: 0.025, total_bytes: 1048576, seq_scan_rate: 0.02, idx_scan_rate: 4.5, last_vacuum_age_seconds: 3600, last_vacuum_at: '2026-08-27T01:00:00Z', last_autovacuum_at: '2026-08-27T01:40:00Z', last_autoanalyze_at: '2026-08-27T01:41:00Z', ts: '2026-08-27T02:00:00Z' }
                    truncated: false
                    relations_not_reported: null
        '400': { $ref: '#/components/responses/BadRequest' }

  /api/v1/instances/{id}/indexes:
    get:
      tags: [instances]
      operationId: getInstanceIndexes
      summary: Return index relation statistics.
      description: The newest reading of each index reported in the last 15 minutes, largest first. idx_scan_rate is scans per second.
      parameters:
        - { name: id, in: path, required: true, schema: { $ref: '#/components/schemas/InstanceId' } }
        - name: limit
          in: query
          required: false
          schema: { type: integer, format: int32, minimum: 1, maximum: 500, default: 50 }
          description: Maximum number of relations returned by the instance-level budget.
      responses:
        '200':
          description: Index rows and cardinality-budget metadata.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RelationResponse' }
              examples:
                default:
                  value:
                    instance_id: 11111111-1111-1111-1111-111111111111
                    items:
                      - { datname: app, schemaname: public, relname: users, indexrelname: users_pkey, idx_scan_rate: 4.5, index_bytes: 524288, is_unique: true, is_primary: true, is_valid: true, ts: '2026-08-27T02:00:00Z' }
                    truncated: false
                    relations_not_reported: null
        '400': { $ref: '#/components/responses/BadRequest' }

  /api/v1/instances/{id}/bloat:
    get:
      tags: [instances]
      operationId: getInstanceBloat
      summary: Return relation bloat estimates.
      description: >-
        The newest reading of each relation and method: estimates from the last
        13 hours (the check runs every 6 hours) and pgstattuple measurements
        from the last 7 days.
      parameters:
        - { name: id, in: path, required: true, schema: { $ref: '#/components/schemas/InstanceId' } }
        - name: method
          in: query
          required: false
          schema: { type: string, enum: [estimate, pgstattuple] }
        - name: limit
          in: query
          required: false
          schema: { type: integer, format: int32, minimum: 1, maximum: 500, default: 50 }
          description: Maximum number of relations returned by the instance-level budget.
      responses:
        '200':
          description: Bloat rows and cardinality-budget metadata.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RelationResponse' }
              examples:
                default:
                  value:
                    instance_id: 11111111-1111-1111-1111-111111111111
                    items:
                      - { datname: app, schemaname: public, relname: users, indexrelname: '', object_kind: table, method: estimate, real_bytes: 1048576, expected_bytes: 851968, bloat_bytes: 196608, bloat_ratio: 0.19, ts: '2026-08-27T02:00:00Z' }
                    truncated: false
                    relations_not_reported: null
        '400': { $ref: '#/components/responses/BadRequest' }

  /api/v1/instances/{id}/command-audit:
    get:
      tags: [instances]
      operationId: getInstanceCommandAudit
      summary: Return the immutable command audit stream for an instance.
      description: >-
        One entry per event of a command: its request, its result (ok, error
        or rejected) or its expiry. Newest first, at most 500 entries.
      parameters:
        - { name: id, in: path, required: true, schema: { $ref: '#/components/schemas/InstanceId' } }
        - { name: limit, in: query, required: false, schema: { type: integer, format: int32, default: 100, minimum: 1 }, description: Maximum entries; values above 500 are capped at 500. }
      responses:
        '200':
          description: Command audit entries.
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/CommandAuditEntry' } }
              examples:
                default:
                  value:
                    - audit_id: 12
                      command_id: 3f2b8c9e-6d1a-4e5f-9a7b-2c4d6e8f0a1b
                      instance_id: 11111111-1111-1111-1111-111111111111
                      kind: explain
                      args: { queryid: '1234567890' }
                      requested_by: ui-session 9f86d081 from 192.0.2.10
                      executed_at: '2026-08-27T02:00:00Z'
                      outcome: requested
        '400': { $ref: '#/components/responses/BadRequest' }

  /api/v1/locks:
    get:
      tags: [instances]
      operationId: getLocks
      summary: Return the latest sampled blocking tree.
      parameters:
        - name: instance_id
          in: query
          required: true
          schema: { $ref: '#/components/schemas/InstanceId' }
      responses:
        '200':
          description: Lock tree; sampled_at null means no tree was ever sampled.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LocksResponse' }
              examples:
                default:
                  value:
                    instance_id: 11111111-1111-1111-1111-111111111111
                    sampled_at: null
                    stale: true
                    nodes: []
        '400': { $ref: '#/components/responses/BadRequest' }

  /api/v1/metrics/query:
    get:
      tags: [metrics]
      operationId: queryMetrics
      summary: Query a metric as a time series.
      description: A metric with more than one series in the range is refused with 400, because this endpoint does not select a series yet; a labelled metric needs a series-selecting parameter before it can be read here.
      parameters:
        - { name: metric, in: query, required: true, schema: { type: string } }
        - { name: instance_id, in: query, required: true, schema: { $ref: '#/components/schemas/InstanceId' } }
        - { name: database, in: query, required: false, schema: { type: string } }
        - { name: from, in: query, required: true, schema: { $ref: '#/components/schemas/Timestamp' } }
        - { name: to, in: query, required: true, schema: { $ref: '#/components/schemas/Timestamp' } }
        - name: step
          in: query
          required: true
          schema: { type: string, example: 60s }
          description: Go duration string; a step producing more than 10000 points returns 422.
      responses:
        '200':
          description: >-
            Fixed-step series; missing intervals are null, never zero or
            interpolated. A bucket holding several samples of the series carries
            their mean. A counter metric, such as pg_xact_commit_total, is
            stored under its own name as a per-second rate, so its values are
            rates and not the cumulative count.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MetricsResponse' }
              examples:
                default:
                  value:
                    series:
                      - { ts: '2026-08-27T00:00:00Z', value: 12 }
                      - { ts: '2026-08-27T00:01:00Z', value: null }
                      - { ts: '2026-08-27T00:02:00Z', value: 15 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /api/v1/events:
    get:
      tags: [events]
      operationId: getEvents
      summary: List events newest first.
      description: >-
        Without from, the newest events are returned, up to limit. Events older
        than the 90-day retention are not kept, so a range is bounded by it.
      parameters:
        - { name: cluster_id, in: query, required: false, schema: { $ref: '#/components/schemas/ClusterId' } }
        - { name: type, in: query, required: false, schema: { type: string } }
        - { name: from, in: query, required: false, schema: { $ref: '#/components/schemas/Timestamp' } }
        - { name: to, in: query, required: false, schema: { $ref: '#/components/schemas/Timestamp' } }
        - name: limit
          in: query
          required: false
          schema: { type: integer, format: int32, default: 100, minimum: 1, maximum: 1000 }
          description: Maximum number of events; capped at 1000.
      responses:
        '200':
          description: Events newest first.
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Event' } }
              examples:
                default:
                  value:
                    - event_id: 1
                      ts: '2026-08-27T01:45:23Z'
                      type: failover_detected
                      cluster_id: '7381927364512345678'
                      instance_id: 22222222-2222-2222-2222-222222222222
                      payload: { old_primary: 11111111-1111-1111-1111-111111111111, new_primary: 22222222-2222-2222-2222-222222222222 }
        '400': { $ref: '#/components/responses/BadRequest' }

  /api/v1/statements:
    get:
      tags: [statements]
      operationId: getStatements
      summary: Return top statements joined to query text.
      description: >-
        Without from, the hour before to (or before now) is aggregated. A
        range is bounded by the retained statement history.
      parameters:
        - { name: instance_id, in: query, required: true, schema: { $ref: '#/components/schemas/InstanceId' } }
        - { name: database, in: query, required: false, schema: { type: string } }
        - { name: from, in: query, required: false, schema: { $ref: '#/components/schemas/Timestamp' } }
        - { name: to, in: query, required: false, schema: { $ref: '#/components/schemas/Timestamp' } }
        - name: order_by
          in: query
          required: false
          schema:
            type: string
            enum: [calls, calls_rate, total_calls, total_exec_time, total_exec_time_ms, exec_time, total_time, total_rows, rows, rows_rate, shared_blks_hit, shared_blks_hit_rate, shared_blks_read, shared_blks_read_rate, wal_bytes, wal_bytes_rate, temp_blks_written, temp_blks_written_rate, mean_exec_time, mean_time]
            default: total_exec_time
        - name: limit
          in: query
          required: false
          schema: { type: integer, format: int32, default: 20, minimum: 1, maximum: 1000 }
      responses:
        '200':
          description: Top statements and comparability scope.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StatementsResponse' }
              examples:
                default:
                  value:
                    statements:
                      - { queryid: '1234', datname: app, query_text: SELECT 1, calls: 10, total_exec_time_ms: 12.5, rows: 10, mean_exec_time: 1.25, shared_blks_hit: 40, shared_blks_read: 2, wal_bytes: 0, temp_blks_written: 0, truncated: false }
                    truncated: false
                    comparable_scope: cluster
                skipped:
                  summary: The agent skips the check
                  value:
                    statements: []
                    truncated: false
                    comparable_scope: cluster
                    disabled: true
                    disabled_reason: missing extension pg_stat_statements
        '400': { $ref: '#/components/responses/BadRequest' }

  /api/v1/ash:
    get:
      tags: [ash]
      operationId: getAsh
      summary: Return activity samples grouped by the requested dimensions.
      description: >-
        With group_by, the range (default: the last hour) is aggregated into
        time buckets of resolution_seconds, at most 180 of them, one row per
        bucket and group. ticks is the instance's sampling ticks in the
        bucket, whatever the filters, so avg_active_sessions is the group's
        share of the instance's time. The largest groups are kept (at most 24,
        fewer when limit rows cannot hold them for every bucket) and the rest
        are folded into one group named other, so the total is conserved.
        Without group_by, the stored rows are returned newest first, every
        dimension included, and a request with no from reads the last hour
        before to, or before now when to is omitted too.
      parameters:
        - { name: instance_id, in: query, required: true, schema: { $ref: '#/components/schemas/InstanceId' } }
        - name: from
          in: query
          required: false
          schema: { $ref: '#/components/schemas/Timestamp' }
          description: Start of the range. Omitted, it is an hour before to, or before now when to is omitted too.
        - { name: to, in: query, required: false, schema: { $ref: '#/components/schemas/Timestamp' } }
        - name: group_by
          in: query
          required: false
          schema: { type: string, enum: [wait_event_type, wait_event, queryid, state, datname] }
        - { name: database, in: query, required: false, schema: { type: string } }
        - name: wait_event_type
          in: query
          required: false
          schema: { type: string }
          description: Only samples of this wait event type; echoed on every returned row.
        - name: wait_event
          in: query
          required: false
          schema: { type: string }
          description: Only samples of this wait event; echoed on every returned row.
        - { name: limit, in: query, required: false, schema: { type: integer, format: int32, default: 1000, minimum: 1, maximum: 10000 } }
      responses:
        '200':
          description: ASH buckets; avg_active_sessions is null when ticks is zero.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AshResponse' }
              examples:
                default:
                  value:
                    resolution_seconds: 20
                    statistical: true
                    buckets:
                      - { ts: '2026-08-27T00:00:00Z', wait_event_type: CPU, samples: 84, ticks: 20, avg_active_sessions: 4.2 }
                      - { ts: '2026-08-27T00:00:00Z', wait_event_type: Lock, samples: 16, ticks: 20, avg_active_sessions: 0.8 }
        '400': { $ref: '#/components/responses/BadRequest' }

  /api/v1/ash/top:
    get:
      tags: [ash]
      operationId: getAshTop
      summary: Return top ASH queries joined to their text.
      description: >-
        Queries are ranked by samples over the range. ticks is the instance's
        sampling ticks over the range, whatever the filters, the same
        denominator for every query. A request with no from ranks the last
        hour before to, or before now when to is omitted too. The ASH disabled
        state is reported by GET /api/v1/ash, not here.
      parameters:
        - { name: instance_id, in: query, required: true, schema: { $ref: '#/components/schemas/InstanceId' } }
        - name: from
          in: query
          required: false
          schema: { $ref: '#/components/schemas/Timestamp' }
          description: Start of the range. Omitted, it is an hour before to, or before now when to is omitted too.
        - { name: to, in: query, required: false, schema: { $ref: '#/components/schemas/Timestamp' } }
        - { name: database, in: query, required: false, schema: { type: string } }
        - name: wait_event_type
          in: query
          required: false
          schema: { type: string }
          description: Only samples of this wait event type.
        - name: wait_event
          in: query
          required: false
          schema: { type: string }
          description: Only samples of this wait event.
        - { name: limit, in: query, required: false, schema: { type: integer, format: int32, default: 20, minimum: 1, maximum: 1000 } }
      responses:
        '200':
          description: Top ASH queries, largest first.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AshTopResponse' }
              examples:
                default:
                  value:
                    resolution_seconds: 1
                    statistical: true
                    entries:
                      - { queryid: '1234567890', query_text: SELECT '* FROM users WHERE id = $1', samples: 45, ticks: 10, avg_active_sessions: 4.5 }
        '400': { $ref: '#/components/responses/BadRequest' }

  /api/v1/plans:
    get:
      tags: [statements]
      operationId: getPlans
      summary: Return plan history for a query.
      parameters:
        - name: queryid
          in: query
          required: true
          schema:
            oneOf:
              - { type: integer, format: int64 }
              - { type: string, pattern: '^-?[0-9]+$' }
        - { name: instance_id, in: query, required: false, schema: { $ref: '#/components/schemas/InstanceId' } }
        - { name: datname, in: query, required: false, schema: { type: string } }
        - { name: limit, in: query, required: false, schema: { type: integer, format: int32, default: 20, minimum: 1, maximum: 500 } }
      responses:
        '200':
          description: Plan history newest first.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlansResponse' }
              examples:
                default:
                  value:
                    plans:
                      - plan_id: 1
                        plan_hash: abc123
                        captured_at: '2026-08-27T02:00:00Z'
                        analyzed: false
                        plan: { Plan: { Node Type: Seq Scan } }
                        changed: false
                    total_shapes: 1
        '400': { $ref: '#/components/responses/BadRequest' }

  /api/v1/alerts:
    get:
      tags: [alerts]
      operationId: getAlerts
      summary: List alerts and their suppression state.
      parameters:
        - name: state
          in: query
          required: false
          schema: { type: string, enum: [pending, firing, resolved, all] }
          description: Omitted returns the pending and firing alerts.
        - { name: severity, in: query, required: false, schema: { type: string } }
        - { name: rule_id, in: query, required: false, schema: { type: string } }
        - { name: instance_id, in: query, required: false, schema: { $ref: '#/components/schemas/InstanceId' } }
        - { name: cluster_id, in: query, required: false, schema: { $ref: '#/components/schemas/ClusterId' } }
      responses:
        '200':
          description: Alerts, capped by the server at 500 entries.
          headers:
            X-Result-Truncated:
              description: Set to true when more than 500 alerts matched and the list was cut to the first 500.
              schema: { type: string, enum: ['true'] }
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Alert' } }
              examples:
                default:
                  value:
                    - alert_key: agent_down/11111111-1111-1111-1111-111111111111
                      rule_id: agent_down
                      severity: critical
                      state: firing
                      cluster_id: '7381927364512345678'
                      instance_id: 11111111-1111-1111-1111-111111111111
                      datname: ''
                      labels: {}
                      value: 1
                      summary: Agent is down
                      started_at: '2026-08-27T02:00:00Z'
                      last_eval_at: '2026-08-27T02:01:00Z'
                      resolved_at: null
                      suppressed: false
        '400': { $ref: '#/components/responses/BadRequest' }

  /api/v1/alerts/{alert_key}:
    get:
      tags: [alerts]
      operationId: getAlert
      summary: Return one alert by alert key.
      parameters:
        - name: alert_key
          in: path
          required: true
          description: Percent-encoded alert key. Keys contain '/' separators, so they must be sent as %2F.
          schema: { type: string }
      responses:
        '200':
          description: Alert detail.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Alert' }
              examples:
                default:
                  value:
                    alert_key: agent_down/11111111-1111-1111-1111-111111111111
                    rule_id: agent_down
                    severity: critical
                    state: firing
                    cluster_id: '7381927364512345678'
                    instance_id: 11111111-1111-1111-1111-111111111111
                    datname: ''
                    labels: {}
                    value: 1
                    summary: Agent is down
                    started_at: '2026-08-27T02:00:00Z'
                    last_eval_at: '2026-08-27T02:01:00Z'
                    resolved_at: null
                    suppressed: false
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/alert-rules:
    get:
      tags: [alerts]
      operationId: getAlertRules
      summary: List alert rules.
      responses:
        '200':
          description: Built-in and stored alert rules.
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/AlertRule' } }
              examples:
                default:
                  value:
                    - { id: agent_down, severity: critical, scope: instance, needs: [up], min_tier: T0, enabled: true, threshold: 1, for_seconds: 90 }

  /api/v1/silences:
    get:
      tags: [alerts]
      operationId: getSilences
      summary: List active silences, or all silences when requested.
      parameters:
        - name: all
          in: query
          required: false
          schema: { type: boolean, default: false }
          description: >-
            True lists every silence, expired ones included, capped at the 500
            that end last.
      responses:
        '200':
          description: Silences ordered by end time.
          headers:
            X-Result-Truncated:
              description: >-
                Set to true when all is true and more than 500 silences exist;
                the silences that ended first were left out.
              schema: { type: string, enum: ['true'] }
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Silence' } }
              examples:
                default:
                  value:
                    - silence_id: 33333333-3333-3333-3333-333333333333
                      matchers: [{ name: severity, value: warning }]
                      reason: maintenance
                      starts_at: '2026-08-29T10:00:00Z'
                      ends_at: '2026-08-29T11:00:00Z'
    post:
      tags: [alerts]
      operationId: createSilence
      summary: Create an alert silence.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateSilenceRequest' }
            examples:
              default:
                value:
                  matchers: [{ name: severity, value: warning }]
                  reason: maintenance
                  starts_at: '2026-08-29T10:00:00Z'
                  ends_at: '2026-08-29T11:00:00Z'
      responses:
        '201':
          description: Silence created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Silence' }
              examples:
                default:
                  value:
                    silence_id: 33333333-3333-3333-3333-333333333333
                    matchers: [{ name: severity, value: warning }]
                    reason: maintenance
                    starts_at: '2026-08-29T10:00:00Z'
                    ends_at: '2026-08-29T11:00:00Z'
        '400': { $ref: '#/components/responses/BadRequest' }
        '409':
          description: A silence with this silence_id already exists.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '503':
          description: Alert storage is unavailable.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/v1/findings:
    get:
      tags: [findings]
      operationId: getFindings
      summary: List advisor findings.
      parameters:
        - { name: state, in: query, required: false, schema: { type: string, default: open,degraded } }
        - { name: severity, in: query, required: false, schema: { type: string } }
        - { name: rule_id, in: query, required: false, schema: { type: string } }
        - { name: datname, in: query, required: false, schema: { type: string } }
        - { name: scope, in: query, required: false, schema: { type: string } }
        - { name: instance_id, in: query, required: false, schema: { $ref: '#/components/schemas/InstanceId' } }
        - { name: cluster_id, in: query, required: false, schema: { $ref: '#/components/schemas/ClusterId' } }
        - name: limit
          in: query
          required: false
          schema: { type: integer, format: int32, default: 100, minimum: 1, maximum: 1000 }
          description: Maximum findings; default 100 and maximum 1000.
      responses:
        '200':
          description: >-
            Findings ordered open and degraded first, then by severity and
            recency, so a limit cuts muted and resolved findings first.
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Finding' } }
              examples:
                default:
                  value:
                    - finding_id: query.slow_mean/11111111-1111-1111-1111-111111111111
                      rule_id: query.slow_mean
                      severity: warning
                      state: open
                      scope: instance
                      title: High mean query latency
        '400': { $ref: '#/components/responses/BadRequest' }

  /api/v1/findings/{finding-id}:
    get:
      tags: [findings]
      operationId: getFinding
      summary: Return one advisor finding.
      parameters:
        - { name: finding-id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Finding detail.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Finding' }
              examples:
                default:
                  value:
                    finding_id: query.slow_mean/11111111-1111-1111-1111-111111111111
                    rule_id: query.slow_mean
                    severity: warning
                    state: open
                    scope: instance
                    title: High mean query latency
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/advisor/rules:
    get:
      tags: [findings]
      operationId: getAdvisorRules
      summary: List the advisor rule catalogue.
      responses:
        '200':
          description: Advisor rule catalogue.
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/AdvisorRule' } }
              examples:
                default:
                  value:
                    - { id: query.slow_mean, severity: warning, scope: instance, needs: [Statements], min_tier: T0 }

  /api/v1/instances/{id}/commands:
    post:
      tags: [commands]
      operationId: createCommand
      summary: Queue a command for an instance.
      parameters:
        - { name: id, in: path, required: true, schema: { $ref: '#/components/schemas/InstanceId' } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateCommandRequest' }
            examples:
              default:
                value: { kind: explain, args: { queryid: 123456789, datname: app, analyze: true } }
      responses:
        '202':
          description: Command accepted and queued.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreateCommandResponse' }
              examples:
                default:
                  value: { command_id: 22222222-2222-2222-2222-222222222222 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '429':
          description: The agent already has the maximum number of pending commands; retry once they run or expire.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503':
          description: Command storage is unavailable.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/v1/commands/{id}:
    get:
      tags: [commands]
      operationId: getCommand
      summary: Read the state and result of a command.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Command state and optional result.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CommandResponse' }
              examples:
                default:
                  value: { command_id: 22222222-2222-2222-2222-222222222222, state: done, result: { plan: {} } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503':
          description: Command storage is unavailable.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/v1/alert-rules/{rule_id}:
    put:
      tags: [alerts]
      operationId: updateAlertRule
      summary: Update a stored alert rule.
      parameters:
        - { name: rule_id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AlertRuleUpdate' }
            examples:
              default:
                value: { enabled: true, severity: warning, threshold: 0.8, for_seconds: 60 }
      responses:
        '200':
          description: Updated alert rule settings.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AlertRuleUpdateResponse' }
              examples:
                default:
                  value: { rule_id: custom_latency, enabled: true, severity: warning, threshold: 0.8, for_seconds: 60 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Built-in tier-0 rules cannot be changed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '503':
          description: Alert storage is unavailable.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/v1/silences/{id}:
    delete:
      tags: [alerts]
      operationId: deleteSilence
      summary: End a silence immediately.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: Silence ended; no response body. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503':
          description: Alert storage is unavailable.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/v1/findings/{finding-id}/mute:
    post:
      tags: [findings]
      operationId: muteFinding
      summary: Mute a finding until a future timestamp, at most 90 days ahead.
      parameters:
        - { name: finding-id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MuteFindingRequest' }
            examples:
              default:
                value: { reason: maintenance, until: '2026-08-29T11:00:00Z' }
      responses:
        '200':
          description: Finding muted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MuteFindingResponse' }
              examples:
                default:
                  value:
                    finding_id: query.slow_mean/11111111-1111-1111-1111-111111111111
                    state: muted
                    muted_until: '2026-08-29T11:00:00Z'
                    mute_reason: maintenance
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '503':
          description: Findings storage is unavailable.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    delete:
      tags: [findings]
      operationId: unmuteFinding
      summary: Remove a finding mute.
      parameters:
        - { name: finding-id, in: path, required: true, schema: { type: string } }
      responses:
        '204': { description: Finding unmuted; no response body. }
        '404': { $ref: '#/components/responses/NotFound' }
        '503':
          description: Findings storage is unavailable.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/v1/session:
    post:
      tags: [session]
      operationId: createSession
      summary: Create a browser UI session.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SessionLoginRequest' }
            examples:
              default:
                value: { password: correct-horse-battery-staple }
      responses:
        '204': { description: Session created; the response sets the pglens_session cookie. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { description: Too many sign-in attempts from this client or too many sign-ins in progress; the Retry-After header gives the wait in seconds. }
        '500':
          description: The browser session could not be created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503':
          description: No session store is configured on this server.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

    get:
      tags: [session]
      operationId: getSession
      summary: Report the current browser UI session.
      security: []
      responses:
        '200':
          description: A valid browser session is active.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionStatus' }
              example: { authenticated: true, expires_at: '2026-08-31T13:00:00Z' }
        '401':
          description: No valid browser session is active.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionStatus' }
              examples:
                configured:
                  value: { authenticated: false, configured: true }
                notConfigured:
                  value: { authenticated: false, configured: false }

    delete:
      tags: [session]
      operationId: deleteSession
      summary: Delete the current browser UI session.
      security:
        - uiSession: []
      responses:
        '204': { description: Session deleted; the response expires the pglens_session cookie. }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/push:
    post:
      tags: [agent]
      operationId: pushEnvelope
      summary: Push an agent envelope to the server.
      security:
        - agentBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PushEnvelope' }
            examples:
              default:
                value:
                  protocol_version: 1
                  agent_id: 11111111-1111-1111-1111-111111111111
                  agent_version: 0.1.0
                  sent_at: '2026-08-29T10:00:00Z'
                  instances: []
      responses:
        '202':
          description: Envelope accepted for processing.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PushResponse' }
              examples:
                default: { value: { accepted: 1, rejected: 0 } }
        '400':
          description: >-
            The body is not JSON or declares a field the envelope does not have,
            protocol_version is outside the supported range, sent_at is too old
            to store, agent_id is not a UUID or is missing from a protocol 3
            envelope, or the store refused the envelope.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '500':
          description: Ingest failed while checking or storing the envelope.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/v1/agents/{agent_id}/commands:
    get:
      tags: [agent]
      operationId: pollCommands
      summary: Poll and claim the next command for an agent.
      security:
        - agentBearer: []
      parameters:
        - { name: agent_id, in: path, required: true, schema: { type: string } }
        - name: wait
          in: query
          required: false
          schema: { type: string, default: 0s }
          description: Go duration to wait; negative values are rejected and values above 30s are capped.
      responses:
        '200':
          description: A command was claimed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PollCommand' }
              examples:
                default:
                  value:
                    command_id: 22222222-2222-2222-2222-222222222222
                    kind: cancel
                    args: { pid: 4242 }
                    instance_id: 11111111-1111-1111-1111-111111111111
                    cluster_id: '7381927364512345678'
                    claim_token: 44444444-4444-4444-4444-444444444444
                    expires_at: '2026-08-29T10:05:00Z'
        '204': { description: No command became available before the wait elapsed. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: The authenticated agent does not own the requested queue, or the agent token was sent without the X-PGLENS-Agent-ID header.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500':
          description: Command polling failed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/v1/commands/{id}/result:
    post:
      tags: [agent]
      operationId: submitCommandResult
      summary: Submit the result of a claimed command.
      security:
        - agentBearer: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CommandResultRequest' }
            examples:
              default:
                value: { claim_token: 44444444-4444-4444-4444-444444444444, outcome: ok, result: { rows: [] } }
      responses:
        '204': { description: Command result accepted; no response body. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409':
          description: Claim token did not match, or the command was expired or no longer claimed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '500':
          description: Command result could not be persisted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503':
          description: Command storage is unavailable.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /healthz:
    get:
      tags: [infrastructure]
      operationId: healthz
      summary: Report process liveness.
      security: []
      responses:
        '200':
          description: The process is alive.
          content:
            text/plain:
              schema: { type: string }
              example: ok

  /readyz:
    get:
      tags: [infrastructure]
      operationId: readyz
      summary: Report database and migration readiness.
      security: []
      responses:
        '200':
          description: The server is ready.
          content:
            text/plain:
              schema: { type: string }
              example: ok
        '503':
          description: The server is not ready.
          content:
            text/plain:
              schema: { type: string }
              example: not ready

  /metrics:
    get:
      tags: [infrastructure]
      operationId: getMetrics
      summary: Expose Prometheus self-monitoring metrics.
      security: []
      responses:
        '200':
          description: Prometheus exposition text; the payload is intentionally not modeled as JSON.
          content:
            text/plain:
              example: '# HELP pglens_up 1 if the instance agent is reachable'
