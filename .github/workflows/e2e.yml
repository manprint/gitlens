name: E2E

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    # Without pipefail a failing step inside a pipeline (the suite piped into a
    # tee, for instance) is masked by the exit status of the last command.
    shell: bash -euo pipefail {0}

permissions:
  contents: read

jobs:
  e2e:
    name: Full E2E / ${{ matrix.agent_mode }}
    runs-on: ubuntu-latest
    # The complete Go suite has its own 90-minute timeout; leave runner
    # headroom for image setup and artifact collection.
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        agent_mode: [container, binary]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 12.15.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Reclaim runner disk space
        # The suite pulls several PostgreSQL images, toxiproxy and both pglens
        # images onto a runner that starts with roughly 14 GB free. The hosted
        # image's preinstalled Android/.NET/Haskell toolchains are worth ~25 GB
        # and nothing here uses them.
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup
          df -h /
      - name: Install frontend dependencies
        run: make web-install
      - name: Install Playwright Chromium
        run: cd web && pnpm exec playwright install --with-deps chromium
      - name: Build fresh E2E images
        run: make build-images
      - name: Run the complete acceptance suite
        run: make test-e2e-full
        env:
          AGENT_MODE: ${{ matrix.agent_mode }}
      - name: Collect Docker diagnostics
        if: failure()
        run: |
          mkdir -p test/e2e/_artifacts
          docker ps -a > test/e2e/_artifacts/docker-ps.txt 2>&1 || true
          docker images > test/e2e/_artifacts/docker-images.txt 2>&1 || true
          df -h / > test/e2e/_artifacts/disk.txt 2>&1 || true
      - name: Upload E2E diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-artifacts-${{ matrix.agent_mode }}
          path: test/e2e/_artifacts/
          if-no-files-found: ignore

  ui-acceptance:
    name: UI acceptance / ${{ matrix.agent_mode }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        agent_mode: [container, binary]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 12.15.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install frontend dependencies
        run: make web-install
      - name: Install Playwright Chromium
        run: cd web && pnpm exec playwright install --with-deps chromium
      - name: Run UI acceptance suite
        # The binary leg runs the four phase-17.2 scenarios to keep CI bounded;
        # the container leg remains the complete eleven-scenario acceptance gate.
        run: |
          if [ "${{ matrix.agent_mode }}" = binary ]; then
            export UI_E2E_RUN='UI_(Failover|UnauthenticatedNavigation|AgentOutage|Accessibility)'
          else
            export UI_E2E_RUN='UI'
          fi
          make test-ui-e2e
        env:
          AGENT_MODE: ${{ matrix.agent_mode }}
      - name: Upload UI acceptance diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ui-acceptance-artifacts-${{ matrix.agent_mode }}
          path: test/e2e/_artifacts/ui/**
          if-no-files-found: ignore
