name: E2E

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    name: Full E2E / ${{ matrix.agent_mode }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        agent_mode: [container, binary]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - name: Build fresh E2E images
        run: make build-images
      - name: Run the complete acceptance suite
        run: make test-e2e-full
        env:
          AGENT_MODE: ${{ matrix.agent_mode }}
      - name: Upload E2E diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts-${{ matrix.agent_mode }}
          path: test/e2e/_artifacts/
          if-no-files-found: ignore
