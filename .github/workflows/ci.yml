name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Keep this fast gate independent; the Docker-backed browser gate lives in e2e.yml.
  web:
    name: Web build and quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Verify generated API types
        run: make web-install web-gen-api && git diff --exit-code -- web/src/api/generated.ts
      - run: make web-lint web-typecheck web-test web-coverage-gate web-build web-budget
      - name: Upload web coverage artefacts
        uses: actions/upload-artifact@v4
        with:
          name: web-coverage
          path: |
            web/coverage/lcov.info
            web/coverage/junit.xml

  lint:
    name: Format and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: make fmt-check
      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.1.6
      - name: Run golangci-lint
        run: |
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          make lint

  unit:
    name: Unit, lint, build, and coverage
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - run: make fmt-check
      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.1.6
      - run: make lint
      - run: make build
      - run: make test
      - run: make coverage-gate

  integration:
    name: Integration PG${{ matrix.pg }} / ${{ matrix.profile }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        pg: ["15", "16", "17", "18"]
        profile: ["vanilla", "rds-like"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - run: make test-integration
        env:
          PGLENS_PG_VERSIONS: ${{ matrix.pg }}
          PGLENS_PG_PROFILE: ${{ matrix.profile }}
