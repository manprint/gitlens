name: Release alpha images

on:
  push:
    tags:
      - 'v*-alpha.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Semantic version for the prerelease, for example v0.1.0-alpha.1'
        required: true
        default: v0.1.0-alpha.1
        type: string

# No job inherits a write scope. Each job that needs one declares it, and the
# job that publishes the GitHub release is the only one with contents: write.
permissions:
  contents: read

jobs:
  tests:
    name: Complete CI gate
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  # This job runs third-party docker actions with a token that can push to
  # GHCR, so it holds packages: write and nothing that can write a release.
  # A job-level permissions block replaces the workflow's, so contents: read
  # is listed again for the checkout.
  images:
    name: Build and push multi-arch alpha images
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      VERSION: ${{ inputs.version || github.ref_name }}
      REGISTRY: ghcr.io
      IMAGE_OWNER: ${{ github.repository_owner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          # Nothing here pushes with git, so the checkout does not need a stored
          # credential.
          persist-credentials: false

      - name: Validate prerelease version
        run: |
          case "$VERSION" in
            v*-alpha.*) ;;
            *) echo "VERSION must match v*-alpha.* (got $VERSION)" >&2; exit 1 ;;
          esac

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare agent image metadata
        id: meta-agent
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/pglens-agent
          tags: |
            type=raw,value=${{ env.VERSION }}
            type=raw,value=alpha
          # description is set explicitly because metadata-action otherwise
          # fills it from the GitHub repository description — the repository's
          # name, not the image's purpose — and the label it writes at push
          # time overrides the one the Dockerfile sets.
          labels: |
            org.opencontainers.image.title=pglens-agent
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.description=pglens agent: PostgreSQL collection and push

      - name: Prepare server image metadata
        id: meta-server
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/pglens-server
          tags: |
            type=raw,value=${{ env.VERSION }}
            type=raw,value=alpha
          # description is set explicitly because metadata-action otherwise
          # fills it from the GitHub repository description — the repository's
          # name, not the image's purpose — and the label it writes at push
          # time overrides the one the Dockerfile sets.
          labels: |
            org.opencontainers.image.title=pglens-server
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.description=pglens server: ingest, HTTP API, and web interface

      - name: Build and push agent image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: Dockerfile.agent
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ env.VERSION }}
          tags: ${{ steps.meta-agent.outputs.tags }}
          labels: ${{ steps.meta-agent.outputs.labels }}
          cache-from: type=gha,scope=pglens-agent
          cache-to: type=gha,mode=max,scope=pglens-agent
          # A published alpha that a QA team installs should say where it came
          # from and what is inside it.
          provenance: mode=max
          sbom: true

      - name: Build and push server image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: Dockerfile.server
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ env.VERSION }}
          tags: ${{ steps.meta-server.outputs.tags }}
          labels: ${{ steps.meta-server.outputs.labels }}
          cache-from: type=gha,scope=pglens-server
          cache-to: type=gha,mode=max,scope=pglens-server
          provenance: mode=max
          sbom: true

      - name: Verify published image versions
        run: |
          docker pull "ghcr.io/$IMAGE_OWNER/pglens-agent:$VERSION"
          docker pull "ghcr.io/$IMAGE_OWNER/pglens-server:$VERSION"
          test "$(docker run --rm "ghcr.io/$IMAGE_OWNER/pglens-agent:$VERSION" --version)" = "$VERSION"
          test "$(docker run --rm "ghcr.io/$IMAGE_OWNER/pglens-server:$VERSION" --version)" = "$VERSION"

      - name: Record published digests
        run: |
          {
            echo "### Published images"
            echo
            echo '| image | digest |'
            echo '| --- | --- |'
            for img in pglens-agent pglens-server; do
              ref="ghcr.io/$IMAGE_OWNER/$img:$VERSION"
              digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$ref")
              echo "| \`$ref\` | \`$digest\` |"
            done
          } >> "$GITHUB_STEP_SUMMARY"

  # The only job with contents: write. It runs no third-party action and does
  # not check out the repository, so the token is seen only by this shell step
  # and the gh CLI it calls. GH_REPO stands in for the checkout's remote.
  release:
    name: Create GitHub prerelease
    needs: images
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ inputs.version || github.ref_name }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Create GitHub prerelease
        run: |
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "Release $VERSION already exists; images were refreshed."
          else
            gh release create "$VERSION" \
              --repo "$GITHUB_REPOSITORY" \
              --prerelease \
              --title "pglens $VERSION" \
              --generate-notes
          fi
