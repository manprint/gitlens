server:
  url: http://pglens-server:8080
  token: dev-token
identity_path: /var/lib/pglens/identity.json
push_interval: 5s
buffer:
  path: /var/lib/pglens/buffer
  max_size: 64MiB
  max_age: 1h
targets:
  # topo-primary-standby.yml's two PostgreSQL services — distinct from
  # agent-standalone.yaml's single "pg" target, which does not exist in
  # this topology at all (that config silently monitored nothing here:
  # every connection attempt failed DNS resolution, addScheduleEntries
  # ended up with zero schedule entries after waitForTarget's 60s
  # timeout, and the agent never pushed a single envelope — confirmed
  # live before this file existed).
  - name: pg-primary
    dsn: postgres://pglens_t2:pglens-monitoring-test@pg-primary:5432/postgres?sslmode=disable
    databases:
      max: 10
    allow_explain_analyze: true
    allow_signal: true
  - name: pg-standby
    dsn: postgres://pglens:pglens-monitoring-test@pg-standby:5432/postgres?sslmode=disable
    databases:
      max: 10
checks:
  activity: { interval: 5s }
  database_stats: { interval: 5s }
  stat_statements: { interval: 10s, top_n: 50 }
