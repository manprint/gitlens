server:
  url: http://pglens-server:8080
  token: dev-token
identity_path: /var/lib/pglens/identity.json
push_interval: 5s
buffer:
  path: /var/lib/pglens/buffer
  max_size: 64MiB
  max_age: 1h
targets:
  - name: pg
    dsn: postgres://pglens:pglens-monitoring-test@pg:5432/postgres?sslmode=disable
    databases:
      max: 10
checks:
  activity: { interval: 5s }
  locks: { interval: 5s }
  database_stats: { interval: 5s }
  settings: { interval: 5s }
  archiver: { interval: 5s }
  table_stats: { interval: 5s }
  index_stats: { interval: 5s }
  bloat_estimate: { interval: 10s }
  # Keep command probes observable within the bounded Full E2E polling window
  # despite startup churn in pg_stat_statements, without exceeding the
  # per-instance series cardinality budget under the full workload.
  stat_statements: { interval: 5s, top_n: 50 }
