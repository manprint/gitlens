server:
  url: http://pglens-server:8080
  token: dev-token
identity_path: /var/lib/pglens/identity.json
push_interval: 5s
buffer:
  path: /var/lib/pglens/buffer
  max_size: 64MiB
  max_age: 1h
targets:
  - name: pg-primary
    dsn: postgres://pglens:pglens-monitoring-test@pg-primary:5432/postgres?sslmode=disable
    databases:
      max: 10
  - name: pg-standby-a
    dsn: postgres://pglens:pglens-monitoring-test@pg-standby-a:5432/postgres?sslmode=disable
    databases:
      max: 10
  - name: pg-standby-b
    dsn: postgres://pglens:pglens-monitoring-test@pg-standby-b:5432/postgres?sslmode=disable
    databases:
      max: 10
checks:
  activity: { interval: 5s }
  database_stats: { interval: 5s }
  stat_statements: { interval: 10s, top_n: 50 }
