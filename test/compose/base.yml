services:
  timescaledb:
    image: timescale/timescaledb:2.29.0-pg17
    environment:
      POSTGRES_PASSWORD: pglens
      POSTGRES_USER: pglens
      POSTGRES_DB: pglens
      # timescaledb must stay first in shared_preload_libraries: overriding
      # POSTGRES_INITDB_ARGS at all drops the image's own default (which
      # preloads timescaledb), so it has to be listed explicitly here or the
      # image's own init script fails with "extension timescaledb must be
      # preloaded" the moment it tries to create the extension.
      POSTGRES_INITDB_ARGS: "-c shared_preload_libraries=timescaledb,pg_stat_statements -c compute_query_id=on -c pg_stat_statements.track=all"
    ports:
      - "5432" # published so test/harness.DB() can connect from the host test process, not just from other containers
    healthcheck:
      # -h 127.0.0.1 is load-bearing, not decoration. The postgres entrypoint
      # runs initdb and every /docker-entrypoint-initdb.d script against a
      # temporary server started with `-c listen_addresses=''` — reachable on
      # the Unix socket and on nothing else — and only then restarts the real
      # one. A socket-only `pg_isready` answers "accepting connections" during
      # that window, so compose marks the service healthy, starts everything
      # with `depends_on: service_healthy`, and pglens-server dies on
      # `connect: connection refused` before the real listener exists. Probing
      # TCP cannot pass early, because the temporary server is not on TCP.
      # Seen exactly once, on a loaded machine where the init phase ran long
      # enough to outlast start_period: five UI scenarios failed at
      # `docker compose up` with "migrate: acquire migration connection".
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U pglens -d pglens"]
      interval: 2s
      timeout: 3s
      retries: 5
      # start_period is generous on purpose. It is not a delay: the container
      # is marked healthy on the first probe that succeeds, so a fast start
      # costs nothing. What it buys is the one boot where initdb actually runs
      # — on this image, initdb plus two preloaded extensions plus every
      # /docker-entrypoint-initdb.d script — which on a loaded machine takes
      # far longer than the ~15s the old 5s/5-retry budget allowed. Failures
      # inside start_period do not count against retries, so the check can
      # honestly refuse to pass during init instead of being tuned loose
      # enough to pass through it.
      start_period: 90s

  pglens-server:
    image: ghcr.io/manprint/pglens-server:dev
    depends_on:
      timescaledb:
        condition: service_healthy
    environment:
      PGLENS_DSN: postgres://pglens:pglens@timescaledb:5432/pglens?sslmode=disable
      PGLENS_BOOTSTRAP_TOKEN: dev-token
      PGLENS_ADVISOR_INTERVAL: 5s
      PGLENS_COMMAND_TTL: 5s
    ports:
      - "8080"
    # The distroless image has no shell or curl; the binary's own
    # --healthcheck flag makes one real HTTP request to its /readyz and
    # exits 0/1 accordingly (see cmd/pglens-server/main.go).
    healthcheck:
      test: ["CMD", "/usr/local/bin/pglens-server", "--healthcheck"]
      interval: 2s
      timeout: 3s
      retries: 5
      # The server runs its migrations before /readyz answers, and on a first
      # boot those migrations meet an empty TimescaleDB. Same reasoning as the
      # database's own start_period above: no cost when it is fast.
      start_period: 60s
