services:
  pglens-agent:
    image: ghcr.io/manprint/pglens-agent:dev
    depends_on:
      pglens-server:
        condition: service_healthy
    environment:
      PGLENS_CONFIG: /etc/pglens/agent.yaml
      PGLENS_SERVER_URL: http://pglens-server:8080
      PGLENS_BOOTSTRAP_TOKEN: dev-token
      # SYS-AGENT-004: simulates a 5-minute-behind system clock (e.g. NTP
      # drift) without touching the container's real time — see run.go's
      # PGLENS_DEBUG_CLOCK_OFFSET handling.
      PGLENS_DEBUG_CLOCK_OFFSET: -5m
    ports:
      - "9187"
    volumes:
      - agent-data:/var/lib/pglens
      - ../fixtures/agent-standalone.yaml:/etc/pglens/agent.yaml:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
    healthcheck:
      test: ["CMD", "/usr/local/bin/pglens-agent", "--healthcheck"]
      interval: 2s
      timeout: 3s
      retries: 5
      start_period: 5s

volumes:
  agent-data:
