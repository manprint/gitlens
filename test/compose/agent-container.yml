services:
  pglens-agent:
    image: ghcr.io/manprint/pglens-agent:dev
    depends_on:
      pglens-server:
        condition: service_healthy
    environment:
      PGLENS_CONFIG: /etc/pglens/agent.yaml
      PGLENS_SERVER_URL: http://pglens-server:8080
      PGLENS_BOOTSTRAP_TOKEN: dev-token
    ports:
      - "9187" # the agent's own /healthz (distinct from pglens-server's), so the host test process can read its real state/buffer_stats/last_error body
    volumes:
      - agent-data:/var/lib/pglens
      - ../fixtures/agent-standalone.yaml:/etc/pglens/agent.yaml:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
    # The distroless image has no shell or curl; the binary's own
    # --healthcheck flag makes one real HTTP request to its /healthz and
    # exits 0/1 accordingly (see cmd/pglens-agent/main.go).
    healthcheck:
      test: ["CMD", "/usr/local/bin/pglens-agent", "--healthcheck"]
      interval: 2s
      timeout: 3s
      retries: 5
      start_period: 5s

volumes:
  agent-data:
