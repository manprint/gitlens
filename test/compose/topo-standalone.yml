services:
  pg:
    image: timescale/timescaledb:2.29.0-pg17
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      # timescaledb must stay first in shared_preload_libraries (see base.yml
      # for why): this image installs the timescaledb extension into every
      # database by default, and overriding POSTGRES_INITDB_ARGS at all
      # drops that default preload, crashing the container on startup with
      # "extension timescaledb must be preloaded" the moment its own
      # init script runs CREATE EXTENSION.
      POSTGRES_INITDB_ARGS: "-c shared_preload_libraries=timescaledb,pg_stat_statements -c compute_query_id=on -c pg_stat_statements.track=all"
    ports:
      # PG_HOST_PORT lets AgentModeBinary pin a fixed host port (set by
      # test/harness before `docker compose up`) instead of Docker's default
      # ephemeral one: verified live that a plain "5432" gets a NEW random
      # host port on every `kill`/`stop` + `start` of this SAME container,
      # even though the container itself isn't recreated. That's invisible
      # to a container-mode agent (it reaches "pg" via stable internal
      # docker DNS, never the host port) but a binary-mode agent runs on the
      # host and must dial this port directly — its DSN's host:port also
      # feeds internal/identity.Fingerprint, so a churned port mid-test was
      # silently minting a brand-new instance identity on every PG restart
      # (SYS-RESET-001: false split_brain_detected + the reset scenario's
      # own instance never showing a resumed rate; SYS-NET-001: agent
      # permanently pointed at a dead port). Defaults to "0" (Docker picks
      # an ephemeral port, same as bare "5432") when unset, so every other
      # AgentMode is unaffected.
      - "${PG_HOST_PORT:-0}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # pg_stat_statements is preloaded (POSTGRES_INITDB_ARGS above) but was
      # never actually CREATE EXTENSIONed anywhere in this topology — every
      # check depending on it (stat_statements, SYS-RESET-002, SYS-LOAD-008)
      # saw "missing extension pg_stat_statements" until this was added.
      - ../fixtures/sql/00_extensions.sql:/docker-entrypoint-initdb.d/00-extensions.sql
      # monitoring_user.sql is mounted OUTSIDE docker-entrypoint-initdb.d: the
      # shipped file needs a :'pw' psql variable no init-script runner
      # supplies, so it must not be auto-run directly (which would fail and,
      # since the postgres entrypoint aborts on any failing init script,
      # take the whole container down with it) — init_monitoring_user.sh
      # (which IS in docker-entrypoint-initdb.d) invokes it with that
      # variable supplied.
      - ../../deploy/sql/monitoring_user.sql:/opt/pglens/monitoring_user.sql
      - ../fixtures/sql/init_monitoring_user.sh:/docker-entrypoint-initdb.d/01-monitoring.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 5
      start_period: 90s

volumes:
  pgdata:
