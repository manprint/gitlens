server:
  url: http://pglens-server:8080
  token_file: /run/secrets/pglens_token
identity_path: /var/lib/pglens/identity.json
push_interval: 15s

host:
  enabled: true
  interval: 30s
  proc_path: /proc
  sys_path: /sys
buffer:
  path: /var/lib/pglens/buffer
  max_size: 512MiB
  max_age: 6h

# The command channel is enabled by default. Set enabled: false for a
# strictly read-only agent that must never poll the server for commands.
commands:
  enabled: true

targets:
  - name: pg-app
    dsn: postgres://pglens@pg-app:5432/postgres?sslmode=require
    cluster_name: pg-prod-eu
    allow_explain_analyze: false
    allow_signal: false
    databases:
      include: ["app_.*"]
      exclude: ["^template\\d$"]
      max: 10
checks:
  activity: { interval: 10s, by_application: false }
  # locks samples blocking sessions every 10 seconds at Tier 0
  locks: { interval: 10s }
  database_stats: { interval: 30s }
  stat_statements: { interval: 60s, top_n: 50 }
