services:
  timescaledb:
    image: timescale/timescaledb:2.31.0-pg17
    environment:
      POSTGRES_PASSWORD: pglens
      POSTGRES_USER: pglens
      POSTGRES_DB: pglens
    ports:
      # Loopback only; this file sets a default superuser password.
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
