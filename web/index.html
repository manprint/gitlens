<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <title>pglens</title>
    <script>
      ;(() => {
        // Keep in step with DEFAULT_PREFERENCES and applyTheme in src: this runs
        // before the bundle, so the first paint already has the right theme.
        const fallback = 'light'
        try {
          const raw = window.localStorage.getItem('pglens.preferences')
          const parsed = raw ? JSON.parse(raw) : null
          const storedTheme = parsed?.theme
          const theme =
            storedTheme === 'dark' || storedTheme === 'light' || storedTheme === 'system'
              ? storedTheme
              : fallback
          const resolved =
            theme === 'system'
              ? window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light'
              : theme
          document.documentElement.classList.toggle('dark', resolved === 'dark')
          document.documentElement.style.colorScheme = resolved
        } catch {
          document.documentElement.style.colorScheme = fallback
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
